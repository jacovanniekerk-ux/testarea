<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DO's &amp; DON'Ts</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--line:#A9BAC8;--blue:#001489;--lblue:#007DBA;--pink:#C8126E;--yellow:#FFC600;--turq:#00A1A3;--bg:#fff;--ink:#0F172A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Century Gothic','CenturyGothic',AppleGothic,sans-serif}
header{background:#fff;border-bottom:4px solid var(--line);padding:10px 12px;display:flex;gap:8px;justify-content:center;position:sticky;top:0;z-index:5}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;transition:transform .15s cubic-bezier(.175,.885,.32,1.275),background .2s}
.btn:active{transform:scale(.9)}
.btn:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.mode,.topic,.seg{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.15)}
header .mode{flex:1;max-width:260px;background:#fff;color:var(--blue);border:3px solid var(--blue);box-shadow:none}
.on{background:var(--turq)!important;color:#fff!important}
main{max-width:1100px;margin:0 auto;padding:16px}
.topics{display:flex;gap:8px;margin-bottom:16px}.topics .btn{flex:1;font-size:1.05rem;padding:14px 8px}
.view{display:none}.view.active{display:block}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{border-radius:12px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.15);overflow:hidden}
.panel h2{margin:0;padding:14px 16px;color:#fff;font-size:1.3rem}
.panel.do h2{background:var(--blue)}.panel.dont h2{background:var(--lblue)}
.panel .body{padding:14px}
textarea{width:100%;height:150px;resize:vertical;border:2px solid #cbd5e1;border-radius:12px;padding:12px;font:inherit;font-size:1rem}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.count{font-weight:700;color:#475569}.count.low{color:var(--pink)}
.panel.do .send{background:var(--blue);color:#fff}.panel.dont .send{background:var(--lblue);color:#fff}
.seg-bar{display:none;gap:8px;margin-bottom:12px}.seg-bar .btn{flex:1}
.feeds{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.feed h3{margin:0 0 10px;font-size:1.2rem;color:#fff;padding:12px 14px;border-radius:12px}
.feed.do h3{background:var(--blue)}.feed.dont h3{background:var(--lblue)}
.card{position:relative;background:var(--bgc);color:var(--fg);flex:0 1 calc(var(--w,70%) - 14px);min-width:min(100%,8em);rotate:var(--rot,0deg);border-radius:12px;padding:14px 16px;box-shadow:0 6px 14px rgba(0,0,0,.25);font-size:1.05rem;line-height:1.4;overflow-wrap:anywhere;transition:background-color 1.5s ease-out}
#f-DO,#f-DONT{display:flex;flex-wrap:wrap;align-items:flex-start;gap:18px 14px;padding-top:12px}
.card::before{content:'';position:absolute;top:-9px;left:50%;width:44px;height:16px;translate:-50% 0;rotate:-2deg;background:rgba(255,255,255,.55);border:1px solid rgba(15,23,42,.1);border-radius:3px}
.card.hl{background:var(--pink)!important;color:#fff!important;font-size:1.25rem;flex-basis:calc(62% - 14px);transition:background-color .4s}
.card.flash{background:var(--yellow)!important;color:var(--ink);transition:none}
.empty{flex:1;color:#64748b;text-align:center;padding:24px}
@keyframes popIn{0%{opacity:0;transform:scale(.4) translateY(20px);background-color:#FFC600}60%{opacity:1;transform:scale(1.05) translateY(-5px);background-color:#FFC600}100%{transform:scale(1) translateY(0)}}
.card-pop-enter{animation:popIn .6s cubic-bezier(.175,.885,.32,1.275) forwards}
.flash-transition{transition:background-color 1.5s ease-out}
@keyframes toast{0%{opacity:0;transform:translate(-50%,40px) scale(.3)}60%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--yellow);color:var(--ink);font-weight:700;padding:14px 22px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none;z-index:10;animation:toast .5s cubic-bezier(.175,.885,.32,1.275)}
@media(max-width:767px){
 .card{flex-basis:calc(max(var(--w,100%),50%) - 14px)!important}
 .pair{grid-template-columns:1fr}
 .seg-bar{display:flex}
 .feeds{grid-template-columns:1fr}
 .feeds[data-show=do] .feed.dont,.feeds[data-show=dont] .feed.do{display:none}
 .feed h3{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
.doodles{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1}
.topics.off{display:none}
.topic-head{margin:0 0 16px;text-align:center;font-size:clamp(2rem,6vw,3.2rem);color:var(--blue);letter-spacing:.03em}
@keyframes headPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.topic-head.pop{animation:headPop .5s cubic-bezier(.175,.885,.32,1.275)}
</style>
</head>
<body>
<svg class="doodles" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="9" aria-hidden="true">
<path stroke="#00A1A3" d="M70 190c-55-30-40-95 15-90 45 5 40 70-5 68-30-2-30-40-5-42"/>
<path stroke="#FFC600" d="M150 120c-50 45-60 120-20 190"/>
<circle cx="1480" cy="80" r="10" stroke="#C8126E"/>
<path stroke="#FFC600" d="M1400 130l22-34M1500 150l45-30"/>
<path stroke="#C8126E" d="M1330 70c90-25 190 0 240 60"/>
<path stroke="#00A1A3" d="M1400 760h150M1370 800h190M1420 840h110"/>
<path stroke="#001489" d="M60 830h110c20 0 25-45 55-35s15 45-10 35h140"/>
<path stroke="#A9BAC8" d="M1250 700c-60 0-70 60-20 70"/>
<path stroke="#FFC600" d="M1120 860c60 10 130-20 170-50"/>
<circle cx="40" cy="520" r="10" stroke="#C8126E"/>
</svg>
<header>
  <button class="btn mode on" data-mode="input">INPUT</button>
  <button class="btn mode" data-mode="view">VIEW FEEDBACK</button>
</header>
<main>
  <section id="input" class="view active">
    <div class="topics off" id="inTopics"></div>
    <h1 class="topic-head" id="topicHead">TOPIC 1</h1>
    <div class="pair">
      <div class="panel do"><h2>DO</h2><div class="body">
        <textarea id="t-DO" maxlength="280" aria-label="DO"></textarea>
        <div class="row"><span class="count" id="c-DO">280 characters remaining</span><button class="btn send" data-type="DO">Submit DO</button></div></div></div>
      <div class="panel dont"><h2>DON'T</h2><div class="body">
        <textarea id="t-DONT" maxlength="280" aria-label="DON'T"></textarea>
        <div class="row"><span class="count" id="c-DONT">280 characters remaining</span><button class="btn send" data-type="DONT">Submit DON'T</button></div></div></div>
    </div>
  </section>
  <section id="view" class="view">
    <div class="topics" id="viTopics"></div>
    <div class="seg-bar"><button class="btn seg on" data-s="do">DO's</button><button class="btn seg" data-s="dont">DON'Ts</button></div>
    <div class="feeds" id="feeds" data-show="do">
      <div class="feed do"><h3>DO's</h3><div id="f-DO"></div></div>
      <div class="feed dont"><h3>DON'Ts</h3><div id="f-DONT"></div></div>
    </div>
  </section>
</main>
<div id="toast">Submitted! Feel free to add more.</div>
<script>
const SUPABASE_URL='https://cftpufjzwpmhgzdcgpjb.supabase.co', SUPABASE_KEY='sb_publishable_b1H_5DJYLQSrr83T_dvz6A_2UAqOVg4';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let inTopic='topic1', viTopic='topic1', rows=[], els=new Map(), app={active_topic:'topic1',self_paced:false};

// Topic buttons (labels only, no titles)
['inTopics','viTopics'].forEach(id=>{
  $('#'+id).innerHTML=[1,2,3].map(n=>`<button class="btn topic${n==1?' on':''}" data-t="topic${n}">Topic ${n}</button>`).join('');
  $('#'+id).onclick=e=>{const b=e.target.closest('.topic');if(!b)return;
    $$('#'+id+' .topic').forEach(x=>x.classList.toggle('on',x===b));
    if(id==='inTopics'){inTopic=b.dataset.t;paintTopic();}else{viTopic=b.dataset.t;renderAll();}};
});
// Topic: set by presenter, unless self-paced is on
function paintTopic(){
  if(!app.self_paced)inTopic=app.active_topic;
  const h=$('#topicHead'),txt='TOPIC '+inTopic.slice(5);
  if(h.textContent!==txt){h.textContent=txt;h.classList.remove('pop');void h.offsetWidth;h.classList.add('pop');}
  $('#inTopics').classList.toggle('off',!app.self_paced);
  $$('#inTopics .topic').forEach(x=>x.classList.toggle('on',x.dataset.t===inTopic));
}
async function loadState(){const {data}=await sb.from('app_state').select('*').eq('id',1).single();if(data){app=data;paintTopic();}}
// Mode switch
$$('.mode').forEach(b=>b.onclick=()=>{
  $$('.mode').forEach(x=>x.classList.toggle('on',x===b));
  $('#input').classList.toggle('active',b.dataset.mode==='input');
  $('#view').classList.toggle('active',b.dataset.mode==='view');
});
// DO / DON'T toggle (+ swipe)
function showSide(s){$('#feeds').dataset.show=s;$$('.seg').forEach(x=>x.classList.toggle('on',x.dataset.s===s));}
$$('.seg').forEach(b=>b.onclick=()=>showSide(b.dataset.s));
let x0=null;$('#feeds').addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
$('#feeds').addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;
  if(Math.abs(dx)>60)showSide(dx<0?'dont':'do');});
// Counters
['DO','DONT'].forEach(t=>{const ta=$('#t-'+t);ta.oninput=()=>{const r=280-ta.value.length;
  $('#c-'+t).textContent=r+' characters remaining';$('#c-'+t).classList.toggle('low',r<30);};});
// Toast
let tt;function toast(msg,color){const t=$('#toast');t.textContent=msg;t.style.background=color||'var(--yellow)';t.style.color=color?'#fff':'var(--ink)';
  t.style.display='none';void t.offsetWidth;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2500);}
// Submit
$$('.send').forEach(b=>b.onclick=async()=>{
  const type=b.dataset.type, ta=$('#t-'+type), content=ta.value.trim();
  if(!content){ta.focus();return;}
  b.disabled=true;
  try{
    const {data:st,error:e1}=await sb.from('app_state').select('active_group,active_topic,self_paced').eq('id',1).single();
    if(e1)throw e1;
    const {error:e2}=await sb.from('feedback').insert({group_id:st.active_group,topic_id:st.self_paced?inTopic:st.active_topic,type,content});
    if(e2)throw e2;
    ta.value='';ta.oninput();
    toast('Submitted! Feel free to add more.', Math.random()<.5?null:'#00A1A3');
  }catch(err){console.error(err);toast('Could not submit. Check your connection and try again.','#C8126E');}
  b.disabled=false;
});
// Feed
// Sticky-note look: tint 50-80% of the brand colour mixed with white (solid, no transparency),
// plus width / height / tilt, all derived from the card id so every screen shows the same board.
const BASE={DO:[0,20,137],DONT:[0,125,186]};
function styleNote(d,r){
  let h=0;for(const c of r.id)h=(h*31+c.charCodeAt(0))>>>0;
  const tint=.5+(h%31)/100, w=[70,58,46,36][(h>>>5)%4], rot=(((h>>>13)%41)-20)/10;
  const rgb=BASE[r.type].map(v=>Math.round(v*tint+255*(1-tint)));
  const L=rgb.map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  const lum=.2126*L[0]+.7152*L[1]+.0722*L[2];
  const fg=1.05/(lum+.05)>=(lum+.05)/.058?'#fff':'#0F172A';
  const s=d.style;s.setProperty('--bgc',`rgb(${rgb})`);s.setProperty('--fg',fg);
  s.setProperty('--w',w+'%');s.setProperty('--rot',rot+'deg');
}
function makeCard(r,isNew){
  const d=document.createElement('div');d.className='card flash-transition'+(r.is_highlighted?' hl':'');d.textContent=r.content;styleNote(d,r);
  if(isNew){d.classList.add('card-pop-enter','flash');
    d.addEventListener('animationend',()=>d.classList.remove('card-pop-enter'),{once:true});
    setTimeout(()=>d.classList.remove('flash'),1500);}
  els.set(r.id,d);return d;
}
function renderAll(){
  els.clear();
  ['DO','DONT'].forEach(t=>{
    const box=$('#f-'+t);box.innerHTML='';
    const list=rows.filter(r=>r.topic_id===viTopic&&r.type===t&&!r.is_deleted);
    if(!list.length)box.innerHTML='<div class="empty">Nothing here yet.</div>';
    list.forEach(r=>box.appendChild(makeCard(r,false)));
  });
}
function addCard(r){
  const box=$('#f-'+r.type);const e=box.querySelector('.empty');if(e)e.remove();
  box.prepend(makeCard(r,true));
}
async function load(){
  const {data,error}=await sb.from('feedback').select('*').eq('is_deleted',false).order('created_at',{ascending:false});
  if(error){console.error(error);return;}
  rows=data;renderAll();
}
sb.channel('feedback-live').on('postgres_changes',{event:'*',schema:'public',table:'feedback'},p=>{
  const r=p.new;
  if(p.eventType==='INSERT'){rows.unshift(r);if(r.topic_id===viTopic&&!r.is_deleted)addCard(r);}
  else if(p.eventType==='UPDATE'){
    const i=rows.findIndex(x=>x.id===r.id);if(i>-1)rows[i]=r;else rows.unshift(r);
    const el=els.get(r.id);
    if(r.is_deleted){if(el){el.remove();els.delete(r.id);}}
    else if(el)el.classList.toggle('hl',!!r.is_highlighted);
  }
}).on('postgres_changes',{event:'*',schema:'public',table:'app_state'},p=>{app=p.new;paintTopic();}).subscribe();
load();loadState();
</script>
</body>
</html>
