<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Past Reports — WCED 4P Diagnostic</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/minimal.min.css" />
    <link rel="stylesheet" href="css/theme.css" />
  </head>
  <body class="min-h-screen">
    <header class="app-header-sticky bg-[#001489] text-white py-3 px-6 shadow-sm">
      <div class="max-w-6xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-4">
          <a href="4p.html" class="text-white/80 hover:text-white transition text-sm flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Dashboard</span>
          </a>
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-user-large text-lg"></i>
            <span id="user-name" class="font-medium"></span>
          </div>
        </div>
        <span id="user-district" class="font-medium text-sm"></span>
      </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-6 pb-24">
      <h1 class="text-[var(--fs-heading-lg)] font-bold text-slate-800 mb-1">Past Reports</h1>
      <p class="text-slate-500 mb-6 text-sm">
        Culture walkthroughs and standalone classroom reports. Drafts can be resumed for editing; submitted reports are locked for audit.
      </p>

      <!-- Filter bar -->
      <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm mb-5">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
          <div id="district-filter-wrap" class="hidden">
            <label class="field-label block mb-1">District</label>
            <select id="district-filter" class="form-field w-full px-2.5 py-1.5 border border-slate-200 rounded-md focus:bg-white focus:ring-1 focus:ring-[#001489] bg-white text-slate-800">
              <option value="">All Districts</option>
            </select>
          </div>
          <div>
            <label class="field-label block mb-1">Circuit</label>
            <select id="circuit-filter" class="form-field w-full px-2.5 py-1.5 border border-slate-200 rounded-md focus:bg-white focus:ring-1 focus:ring-[#001489] bg-white text-slate-800">
              <option value="">All Circuits</option>
            </select>
          </div>
          <div>
            <label class="field-label block mb-1">Status</label>
            <select id="submitted-filter" class="form-field w-full px-2.5 py-1.5 border border-slate-200 rounded-md focus:bg-white focus:ring-1 focus:ring-[#001489] bg-white text-slate-800">
              <option value="all">All</option>
              <option value="submitted">Submitted</option>
              <option value="draft">Draft</option>
            </select>
          </div>
          <div class="lg:col-span-2">
            <label class="field-label block mb-1">Search School</label>
            <input type="text" id="school-search" list="school-datalist" placeholder="Type a school name..."
                   class="form-field w-full px-2.5 py-1.5 border border-slate-200 rounded-md focus:bg-white focus:ring-1 focus:ring-[#001489] bg-white text-slate-800" />
            <datalist id="school-datalist"></datalist>
          </div>
        </div>
        <div class="mt-3 flex items-center justify-between">
          <button id="clear-filters-btn" type="button" class="text-[11px] font-bold text-slate-400 hover:text-slate-600 flex items-center gap-1">
            <i class="fa-solid fa-xmark"></i>
            <span>Clear filters</span>
          </button>
          <p id="results-count" class="text-[11px] text-slate-400 font-semibold"></p>
        </div>
      </div>

      <div id="reports-table-wrap" class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-x-auto">
        <p class="text-sm text-slate-400 p-4">Loading...</p>
      </div>
    </main>

    <script type="module">
      import { requireSession } from './js/session.js';
      import { fetchSchoolsForAdvisor, isHeadOffice } from './js/schools.js';
      import { fetchWalkthroughsForAdvisorScope } from './js/culture-walkthroughs.js';
      import { fetchStandaloneObservationsForAdvisorScope } from './js/classroom-observations.js';

      const advisor = requireSession('4p.html');
      if (!advisor) {
        throw new Error('No advisor session — redirecting to login.');
      }

      const headOffice = isHeadOffice(advisor);

      document.getElementById('user-name').textContent = advisor.full_name;
      document.getElementById('user-district').textContent = advisor.district;

      const districtFilterWrap = document.getElementById('district-filter-wrap');
      const districtFilter = document.getElementById('district-filter');
      const circuitFilter = document.getElementById('circuit-filter');
      const submittedFilter = document.getElementById('submitted-filter');
      const schoolSearch = document.getElementById('school-search');
      const schoolDatalist = document.getElementById('school-datalist');
      const clearFiltersBtn = document.getElementById('clear-filters-btn');
      const resultsCount = document.getElementById('results-count');
      const tableWrap = document.getElementById('reports-table-wrap');

      const UNASSIGNED = '__unassigned__';

      let allSchools = [];
      let allReports = []; // normalized: both walkthroughs and standalone classroom reports

      function escapeHtml(str) {
        if (str === null || str === undefined || str === '') return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function formatDate(value) {
        if (!value) return '—';
        return new Date(value).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      }

      // ------------------------------------------------------------
      // Data loading
      // ------------------------------------------------------------
      async function loadData() {
        const [schoolsRes, walkthroughsRes, classroomsRes] = await Promise.all([
          fetchSchoolsForAdvisor(advisor),
          fetchWalkthroughsForAdvisorScope(advisor),
          fetchStandaloneObservationsForAdvisorScope(advisor),
        ]);

        if (schoolsRes.error || walkthroughsRes.error || classroomsRes.error) {
          const err = schoolsRes.error || walkthroughsRes.error || classroomsRes.error;
          tableWrap.innerHTML = `<p class="text-sm text-red-600 p-4">Could not load Past Reports: ${escapeHtml(err.message)}</p>`;
          return;
        }

        allSchools = schoolsRes.data || [];

        const walkthroughRows = (walkthroughsRes.data || []).map((w) => ({
          id: w.id,
          type: 'walkthrough',
          schoolName: w.schools ? w.schools.school_name : w.school_cemis,
          district: w.schools ? w.schools.district : '',
          circuit: w.schools ? w.schools.circuit : null,
          dateValue: w.visit_date,
          submitted: w.submitted,
          subLabel: null,
          resumeHref: `culture-walkthrough.html?id=${w.id}`,
          reportHref: `report.html?type=walkthrough&id=${w.id}`,
        }));

        const classroomRows = (classroomsRes.data || []).map((c) => ({
          id: c.id,
          type: 'classroom',
          schoolName: c.schools ? c.schools.school_name : c.school_cemis,
          district: c.schools ? c.schools.district : '',
          circuit: c.schools ? c.schools.circuit : null,
          dateValue: c.created_at,
          submitted: c.submitted,
          subLabel: c.teacher_name || c.subject_observed || null,
          resumeHref: `classroom-report.html?id=${c.id}`,
          reportHref: `report.html?type=classroom&id=${c.id}`,
        }));

        allReports = [...walkthroughRows, ...classroomRows].sort(
          (a, b) => new Date(b.dateValue || 0) - new Date(a.dateValue || 0)
        );

        setupFilterOptions();
        applyFiltersAndRender();
      }

      // ------------------------------------------------------------
      // Filter option population
      // ------------------------------------------------------------
      function setupFilterOptions() {
        if (headOffice) {
          districtFilterWrap.classList.remove('hidden');
          const districts = [...new Set(allSchools.map((s) => s.district).filter(Boolean))].sort();
          districtFilter.innerHTML =
            '<option value="">All Districts</option>' +
            districts.map((d) => `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
        }

        populateCircuitOptions();

        schoolDatalist.innerHTML = [...new Set(allSchools.map((s) => s.school_name))]
          .sort()
          .map((name) => `<option value="${escapeHtml(name)}"></option>`)
          .join('');
      }

      // Circuit options narrow to the currently-selected district (HEAD
      // OFFICE only — everyone else's schools are already scoped to
      // their one district, so there's nothing to narrow further).
      function populateCircuitOptions() {
        const districtScope = headOffice ? districtFilter.value : null;
        const schoolsInScope = districtScope
          ? allSchools.filter((s) => s.district === districtScope)
          : allSchools;

        const circuits = [...new Set(schoolsInScope.map((s) => s.circuit).filter(Boolean))].sort();
        const hasUnassigned = schoolsInScope.some((s) => !s.circuit);

        circuitFilter.innerHTML =
          '<option value="">All Circuits</option>' +
          circuits.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('') +
          (hasUnassigned ? `<option value="${UNASSIGNED}">Unassigned Circuit</option>` : '');
      }

      // ------------------------------------------------------------
      // Filtering + rendering
      // ------------------------------------------------------------
      function applyFiltersAndRender() {
        const districtVal = headOffice ? districtFilter.value : null;
        const circuitVal = circuitFilter.value;
        const submittedVal = submittedFilter.value;
        const searchVal = schoolSearch.value.trim().toLowerCase();

        const filtered = allReports.filter((r) => {
          if (districtVal && r.district !== districtVal) return false;

          if (circuitVal === UNASSIGNED && r.circuit) return false;
          if (circuitVal && circuitVal !== UNASSIGNED && r.circuit !== circuitVal) return false;

          if (submittedVal === 'submitted' && !r.submitted) return false;
          if (submittedVal === 'draft' && r.submitted) return false;

          if (searchVal && !r.schoolName.toLowerCase().includes(searchVal)) return false;

          return true;
        });

        renderTable(filtered);
        resultsCount.textContent = `${filtered.length} report${filtered.length === 1 ? '' : 's'}`;
      }

      function statusBadgeHtml(submitted) {
        return submitted
          ? '<span class="inline-flex items-center gap-1 text-[9.5px] font-black uppercase px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700"><i class="fa-solid fa-lock"></i> Submitted</span>'
          : '<span class="inline-flex items-center gap-1 text-[9.5px] font-black uppercase px-2 py-0.5 rounded-full bg-amber-50 text-amber-700"><i class="fa-solid fa-pen"></i> Draft</span>';
      }

      function typeBadgeHtml(type) {
        return type === 'walkthrough'
          ? '<span class="text-[9.5px] font-black uppercase px-2 py-0.5 rounded bg-blue-50 text-[#001489]">Walkthrough</span>'
          : '<span class="text-[9.5px] font-black uppercase px-2 py-0.5 rounded bg-emerald-50 text-emerald-700">Classroom</span>';
      }

      function renderTable(reports) {
        if (reports.length === 0) {
          tableWrap.innerHTML = '<p class="text-sm text-slate-400 p-6 text-center">No reports match the current filters.</p>';
          return;
        }

        const districtHeaderHtml = headOffice ? '<th class="text-left px-3 py-2">District</th>' : '';

        const rowsHtml = reports
          .map((r) => {
            const districtCellHtml = headOffice ? `<td class="px-3 py-2 text-slate-600">${escapeHtml(r.district)}</td>` : '';
            const action = r.submitted
              ? `<a href="${r.reportHref}" class="inline-flex items-center gap-1 text-[11px] font-bold text-emerald-700 hover:text-emerald-800"><span>View Report</span><i class="fa-solid fa-chart-simple"></i></a>`
              : `<a href="${r.resumeHref}" class="inline-flex items-center gap-1 text-[11px] font-bold text-[#001489] hover:text-[#000e60]"><span>Resume</span><i class="fa-solid fa-arrow-right"></i></a>`;

            return `
              <tr class="border-t border-slate-100 hover:bg-slate-50/60 transition">
                <td class="px-3 py-2">
                  <span class="font-bold text-slate-800 text-xs">${escapeHtml(r.schoolName)}</span>
                  ${r.subLabel ? `<span class="block text-[10px] text-slate-400">${escapeHtml(r.subLabel)}</span>` : ''}
                </td>
                <td class="px-3 py-2">${typeBadgeHtml(r.type)}</td>
                ${districtCellHtml}
                <td class="px-3 py-2 text-slate-600">${escapeHtml(r.circuit) || '<span class="text-slate-300">Unassigned</span>'}</td>
                <td class="px-3 py-2 text-slate-600 whitespace-nowrap">${formatDate(r.dateValue)}</td>
                <td class="px-3 py-2">${statusBadgeHtml(r.submitted)}</td>
                <td class="px-3 py-2 text-right whitespace-nowrap">${action}</td>
              </tr>`;
          })
          .join('');

        tableWrap.innerHTML = `
          <table class="w-full text-xs">
            <thead>
              <tr class="bg-slate-50 border-b border-slate-200 text-[10px] font-black uppercase text-slate-500 tracking-wide">
                <th class="text-left px-3 py-2">School</th>
                <th class="text-left px-3 py-2">Type</th>
                ${districtHeaderHtml}
                <th class="text-left px-3 py-2">Circuit</th>
                <th class="text-left px-3 py-2">Date</th>
                <th class="text-left px-3 py-2">Status</th>
                <th class="text-right px-3 py-2">Action</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>`;
      }

      // ------------------------------------------------------------
      // Wiring
      // ------------------------------------------------------------
      districtFilter.addEventListener('change', () => {
        populateCircuitOptions();
        circuitFilter.value = ''; // district change invalidates the old circuit selection
        applyFiltersAndRender();
      });
      circuitFilter.addEventListener('change', applyFiltersAndRender);
      submittedFilter.addEventListener('change', applyFiltersAndRender);
      schoolSearch.addEventListener('input', applyFiltersAndRender);

      clearFiltersBtn.addEventListener('click', () => {
        if (headOffice) districtFilter.value = '';
        populateCircuitOptions();
        circuitFilter.value = '';
        submittedFilter.value = 'all';
        schoolSearch.value = '';
        applyFiltersAndRender();
      });

      loadData();
    </script>
  </body>
</html>
