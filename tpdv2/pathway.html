        const EDVANCE_ARC = {

        };

        // === SESSION HELPERS (copied from profile.html so all pages stay in sync) ===
        const WEEKDAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const SAST_OFFSET_MS = 2 * 60 * 60 * 1000; // Africa/Johannesburg is a fixed UTC+2, no DST

        const pad2 = (n) => String(n).padStart(2, '0');

        const getJoburgParts = (timestampMs) => {
            const shifted = new Date(timestampMs + SAST_OFFSET_MS);
            return {
                year: shifted.getUTCFullYear(),
                month: shifted.getUTCMonth() + 1,
                day: shifted.getUTCDate(),
                hours: shifted.getUTCHours(),
                minutes: shifted.getUTCMinutes(),
                seconds: shifted.getUTCSeconds(),
                weekdayIdx: shifted.getUTCDay()
            };
        };

        const toEpoch = (dateStr, timeStr) => {
            if (!dateStr || !timeStr) return null;
            const ts = new Date(`${dateStr}T${timeStr}+02:00`).getTime();
            return isNaN(ts) ? null : ts;
        };

        const buildGoogleCalendarLink = ({ startParts, endParts, name, description, joinLink }) => {
            const fmt = (p) => `${p.year}${pad2(p.month)}${pad2(p.day)}T${pad2(p.hours)}${pad2(p.minutes)}${pad2(p.seconds)}`;
            const text = `\u{1F4BB} eTPD Webinar: ${name}`;
            const details = `${description || ''}\n\n\u{1F517} Join Link: \n${joinLink || ''}\n\n\u2139\uFE0F For more info: https://bit.ly/m/wcedtpd`;
            return `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(text)}&dates=${fmt(startParts)}/${fmt(endParts)}&details=${encodeURIComponent(details)}&location=MS%20Teams&ctz=Africa/Johannesburg`;
        };

        const buildOutlookLink = ({ startParts, endParts, name, joinLink }) => {
            const iso = (p) => `${p.year}-${pad2(p.month)}-${pad2(p.day)}T${pad2(p.hours)}:${pad2(p.minutes)}:${pad2(p.seconds)}`;
            const body = `Join Link: ${joinLink || ''}`;
            return `https://outlook.office.com/calendar/0/action/compose?allday=false&body=${encodeURIComponent(body)}&enddt=${encodeURIComponent(iso(endParts))}&location=Virtual%20Session&path=/calendar/action/compose&rru=addevent&startdt=${encodeURIComponent(iso(startParts))}&subject=${encodeURIComponent(name)}`;
        };

        const combineSessionsAndCourses = (sessionRows, courseRows) => {
            const coursesByName = new Map();
            (courseRows || []).forEach(c => {
                if (c.course_name) coursesByName.set(c.course_name, c);
            });

            return (sessionRows || [])
                .filter(s => s.session_delivery_mode === 'Virtual')
                .map(s => {
                    const course = coursesByName.get(s.session_title) || {};
                    const durationMin = Number(course.programme_duration) || 0;

                    const startEpoch = toEpoch(s.session_date, s.session_start_time);
                    const endEpoch = startEpoch !== null ? startEpoch + durationMin * 60000 : null;

                    const startParts = startEpoch !== null ? getJoburgParts(startEpoch) : null;
                    const endParts = endEpoch !== null ? getJoburgParts(endEpoch) : null;

                    const dateISO = s.session_date || '';
                    const timeDisplay = (startParts && endParts)
                        ? `${pad2(startParts.hours)}:${pad2(startParts.minutes)} - ${pad2(endParts.hours)}:${pad2(endParts.minutes)}`
                        : '';

                    const district = s.hosting_unit || 'Unspecified';
                    const name = s.session_title || 'Untitled Session';

                    const googleCal = (startParts && endParts)
                        ? buildGoogleCalendarLink({ startParts, endParts, name, description: course.session_desciption, joinLink: s.session_link })
                        : '#';
                    const outlookCal = (startParts && endParts)
                        ? buildOutlookLink({ startParts, endParts, name, joinLink: s.session_link })
                        : '#';

                    return {
                        id: s.id_key,
                        date: dateISO,
                        time: timeDisplay,
                        district,
                        name,
                        level: course.developmental_level || '',
                        description: course.session_desciption || '',
                        googleCal,
                        outlookCal,
                        joinLink: s.session_link || '',
                        startTimestamp: startEpoch,
                        endTimestamp: endEpoch
                    };
                })
                .filter(s => s.name !== 'Untitled Session');
        };
        function getLevelColor(level) {
            if (!level) return 'bg-gray-200 text-gray-800';
            const normalized = level.toLowerCase().trim();
            if (normalized === 'laying the foundation') return 'bg-wcg-green text-white';
            if (normalized === 'i can do it') return 'bg-wcg-yellow text-black';
            if (normalized === 'i can do it better') return 'bg-wcg-red text-white';
            if (normalized === 'the summit') return 'bg-wcg-blue text-white';
            return 'bg-gray-200 text-gray-800';
        }

        // === UTILITIES ===
        const toISODateString = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        const parseDate = (dateStr) => {
            if (!dateStr) return null;
            const d = new Date(`${dateStr}T00:00:00`);
            return isNaN(d.getTime()) ? null : d;
        };
        const formatDate = (d) => d ? `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}` : 'N/A';

        function Menu() {

        // === MILESTONE DETAIL MODAL ===
        function MilestoneModal({ milestone, milestoneCourseSessions, onClose }) {
            const linkBtn = "inline-flex items-center gap-2 px-4 py-2 rounded-lg font-bold text-sm text-white transition-colors shadow";

                const avail = milestone.availability;

                if (avail.type === 'registration') {
                    if (milestoneCourseSessions === null) {
                        return e('p', { className: "text-sm text-gray-500" }, "Checking availability…");
                    }
                    const upcoming = milestone.sparkSession ? milestoneCourseSessions[milestone.sparkSession] : null;
                    return e('div', null,
                        e('h4', { className: "font-semibold text-gray-900 mb-1" }, upcoming ? 'Registration Open' : 'Registration Closed'),
                        e('p', { className: "text-sm text-gray-700" }, upcoming ? avail.activeMessage : avail.expiredMessage),
                        upcoming ? e('div', { className: "mt-3" },
                            e('p', { className: "text-xs text-gray-500 mb-2" }, `Next session: ${formatDate(parseDate(upcoming.session_date))}`),
                            e('a', { href: `register.html?idkey=${encodeURIComponent(upcoming.id_key)}`, target: "_blank", rel: "noopener noreferrer", className: `${linkBtn} bg-green-600 hover:bg-green-700` }, "Register Now")
                        ) : e('div', { className: "mt-3" },
                            e('a', { href: avail.waitlistUrl || '#', target: "_blank", rel: "noopener noreferrer", className: `${linkBtn} bg-wcg-blue hover:bg-blue-800` }, "Join Waitlist")
                        )
                    );

                if (avail.type === 'waitlist_only') {
                    return e('div', null,
                        e('h4', { className: "font-semibold text-gray-900 mb-1" }, "By Invitation Only"),
                        e('p', { className: "text-sm text-gray-700" }, avail.message),
                        e('div', { className: "mt-3" },
                            e('a', { href: avail.waitlistUrl || '#', target: "_blank", rel: "noopener noreferrer", className: `${linkBtn} bg-wcg-blue hover:bg-blue-800` }, "Join Waitlist")

            return e('div', { className: "fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop", onClick: onClose },

                            e(IconImg, { src: milestone.icon, className: "w-16 h-16 object-contain" })),
                        e('h2', { className: "text-2xl font-bold" }, milestone.title),
                        e('p', { className: "text-white/80 font-semibold" }, milestone.subtitle),
                        e('span', { className: "inline-block mt-3 px-4 py-1 bg-white/20 backdrop-blur-md rounded-full text-xs font-bold" }, milestone.duration)
                    ),
                    e('div', { className: "p-6 space-y-6" },

                            e('p', { className: "text-xs italic mb-2", style: { color: milestone.color } }, "These 10 sessions form a curated learning pathway within the broader micro-learning landscape."),
                            e('div', { className: "space-y-1.5" },
                                DOVETAIL_SESSIONS.map((session, idx) => e('div', { key: idx, className: "flex items-center gap-2 p-2 rounded-lg border border-gray-200 bg-gray-50" },
                                    e('span', { className: "flex-shrink-0 w-5 h-5 rounded-full flex items-center justify-center text-xs bg-gray-300 text-gray-600" }, idx + 1),
                                    e('span', { className: "text-sm text-gray-600" }, session)
                                ))
                            ),
                            milestone.sessionsInfoUrl ? e('div', { className: "mt-3" },
                                e('a', { href: milestone.sessionsInfoUrl, target: "_blank", rel: "noopener noreferrer", className: linkBtn, style: { background: milestone.color } }, "View Session Details & Schedule")
                            ) : null
                        ) : null,
                        renderAvailability(),
                        milestone.next ? e('div', null,
                            e('h3', { className: h3, style: { color: '#001489' } }, "Next Steps"),
                            e('p', { className: "text-sm text-gray-600" }, milestone.next)
                        ) : null
                    )
                )
            );
        }


        // === THIS WEEK / NEXT WEEK STRIP ===
        // Weeks run Monday–Sunday. Only sessions from today onwards are shown.
        function getWeekWindow() {
            const today = new Date();
            const dow = (today.getDay() + 6) % 7; // Mon=0 … Sun=6
            const endThis = new Date(today); endThis.setDate(today.getDate() + (6 - dow));
            const endNext = new Date(endThis); endNext.setDate(endThis.getDate() + 7);
            return { todayISO: toISODateString(today), endThisISO: toISODateString(endThis), endNextISO: toISODateString(endNext) };
        }

        function SessionCard({ s, todayISO }) {
            const d = parseDate(s.date);
            const canPreReg = s.id && window.PreRegisterWidget && window.PreRegisterWidget.trigger;
            const calBtn = "flex-1 text-center text-xs font-bold py-2.5 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors";
            return e('div', { className: "snap-start flex-shrink-0 w-[80%] sm:w-72 lg:w-auto bg-gray-50 rounded-xl p-4 flex flex-col border-l-4 border-wcg-blue" },
                e('div', { className: "flex items-center gap-3 mb-2" },
                    e('div', { className: "w-12 h-12 rounded-lg bg-wcg-blue text-white flex flex-col items-center justify-center flex-shrink-0 leading-tight" },
                        e('span', { className: "text-[10px] font-semibold" }, d ? WEEKDAY_NAMES[d.getDay()] : ''),
                        e('span', { className: "text-lg font-bold" }, d ? d.getDate() : ''),
                        e('span', { className: "text-[10px]" }, d ? MONTH_NAMES[d.getMonth()] : '')
                    ),
                    e('div', { className: "min-w-0" },
                        e('p', { className: "text-xs font-bold text-gray-700" }, s.date === todayISO ? 'Today' : '', s.date === todayISO && s.time ? ' · ' : '', s.time),
                        s.level ? e('span', { className: `inline-block mt-1 px-2 py-0.5 rounded-full text-[10px] font-bold ${getLevelColor(s.level)}` }, s.level) : null
                    )
                ),
                e('h5', { className: "font-bold text-sm text-gray-900 leading-snug" }, s.name),
                e('p', { className: "text-xs text-gray-500 mt-1" }, s.district),
                s.description ? e('p', { className: "text-xs text-gray-600 mt-2 line-clamp-2" }, s.description) : null,
                e('div', { className: "mt-auto pt-3 space-y-2" },
                    canPreReg ? e('button', {
                        type: "button",
                        onClick: () => window.PreRegisterWidget.trigger({ idKey: s.id, title: s.name }),
                        className: "w-full bg-wcg-blue text-white text-sm font-bold py-2.5 rounded-lg hover:bg-blue-800 transition-colors shadow"
                    }, "Pre-Register") : null,
                    e('div', { className: "flex gap-2" },
                        e('a', { href: s.googleCal, target: "_blank", rel: "noopener noreferrer", className: calBtn, 'aria-label': `Add ${s.name} to Google Calendar` }, "+ Google Cal"),
                        e('a', { href: s.outlookCal, target: "_blank", rel: "noopener noreferrer", className: calBtn, 'aria-label': `Add ${s.name} to Outlook Calendar` }, "+ Outlook")
                    )
                )
            );
        }

        function SessionsStrip({ sessions, todayISO, endThisISO }) {
            const row = "flex gap-3 overflow-x-auto snap-x snap-mandatory pb-2 -mx-1 px-1 lg:grid lg:grid-cols-4 lg:overflow-visible";
            const groups = sessions ? [
                { label: 'This week', items: sessions.filter(s => s.date <= endThisISO) },
                { label: 'Next week', items: sessions.filter(s => s.date > endThisISO) }
            ] : [];
            return e('div', { className: "bg-white rounded-2xl shadow-lg p-4 sm:p-6 mt-6 animate-fade-in-up" },
                e('div', { className: "flex flex-wrap items-baseline justify-between gap-2 mb-4" },
                    e('h3', { className: "text-lg font-bold text-wcg-dark" }, "Happening This Week & Next"),
                    e('a', { href: "sessions.html", className: "text-xs font-bold text-wcg-blue hover:underline" }, "See all upcoming sessions →")
                ),
                sessions === null ? e('p', { className: "text-sm text-gray-500" }, "Loading sessions…")
                : sessions.length === 0 ? e('p', { className: "text-sm text-gray-600" }, "No virtual sessions are scheduled for this week or next. Check back soon or browse all upcoming sessions.")
                : groups.filter(g => g.items.length > 0).map(g => e('div', { key: g.label, className: "mb-4 last:mb-0" },
                    e('h4', { className: "text-sm font-bold text-gray-700 mb-2" }, `${g.label} (${g.items.length})`),
                    e('div', { className: row }, g.items.map(s => e(SessionCard, { key: s.id + s.date, s, todayISO })))
                ))
            );
        }

        // === PAGE ===
        function PathwayPage() {
            const [selected, setSelected] = useState(null);
            // null = still loading; {} = loaded, nothing upcoming
            const [milestoneCourseSessions, setMilestoneCourseSessions] = useState(null);
            const [weekSessions, setWeekSessions] = useState(null);
            const week = getWeekWindow();

            // Virtual sessions from today to the end of next week
            useEffect(() => {
                (async () => {
                    try {
                        const [sessionRes, courseRes] = await Promise.all([
                            supabaseClient.from('sessions').select('*').eq('session_delivery_mode', 'Virtual')
                                .gte('session_date', week.todayISO).lte('session_date', week.endNextISO)
                                .order('session_date', { ascending: true }).order('session_start_time', { ascending: true }),
                            supabaseClient.from('courses').select('*')
                        ]);
                        if (sessionRes.error) throw sessionRes.error;
                        if (courseRes.error) throw courseRes.error;
                        setWeekSessions(combineSessionsAndCourses(sessionRes.data, courseRes.data));
                    } catch (err) {
                        console.error('Error fetching this week/next week sessions:', err);
                        setWeekSessions([]);
                    }
                })();
            }, []);

            // Same rule as profile.html: a registration milestone is "open" when a
            // session with a matching title exists today or later.
            useEffect(() => {
                (async () => {
                    const names = MILESTONES.filter(m => m.availability && m.availability.type === 'registration' && m.sparkSession).map(m => m.sparkSession);
                    try {
                        const { data, error } = await supabaseClient.from('sessions')
                            .select('id_key, session_title, session_date')
                            .in('session_title', names)
                            .gte('session_date', toISODateString(new Date()))
                            .order('session_date', { ascending: true });
                        if (error) throw error;
                        const soonest = {};
                        (data || []).forEach(row => {
                            const t = row.session_title && row.session_title.trim();
                            if (t && !soonest[t]) soonest[t] = row;
                        });
                        setMilestoneCourseSessions(soonest);
                    } catch (err) {
                        console.error('Error fetching course sessions from Supabase:', err);
                        setMilestoneCourseSessions({});
                    }
                })();
            }, []);

            return e('div', { className: "min-h-screen bg-gray-50" },
                window.PreRegisterWidget ? e(window.PreRegisterWidget.Provider, { hideBanner: true }) : null,
                null,
                e('div', { className: "max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" },
                    e('div', { className: "bg-white rounded-2xl shadow-lg p-6 animate-fade-in-up" },
                        e('div', { className: "text-center max-w-3xl mx-auto mb-6" },
                            e('h1', { className: "text-3xl font-bold text-wcg-blue mb-2" }, "Your Pathway to Transformation"),
                            e('p', { className: "text-sm text-gray-600 leading-relaxed" }, "Professional development isn’t about collecting tools, it is about building the confidence and pedagogical insight to transform learning. The Adoption and Transformation Pathway is designed around your personal growth, guiding you from foundational digital literacy to practical competence, and ultimately to digital wisdom."),
e('p', { className: "text-sm text-gray-600 leading-relaxed mt-3" }, "Explore the five key milestones below to discover how you can earn Sparks, expand your practice, and grow as a leader in your school community. Want to see how far you've already come? Use the button below to review your personal engagement history and map out your next step."),
                            e('a', { href: "profile.html", className: "inline-block mt-4 px-6 py-2.5 rounded-full text-white font-semibold text-sm shadow-md hover:shadow-lg transition-shadow", style: { background: 'linear-gradient(135deg, #001489, #007DBA)' } }, "View My Progress on This Pathway")
                        ),
                        e('h4', { className: "text-base font-bold text-gray-800 mb-4" }, "Adoption and Transformation Pathway"),
                        e('div', { className: "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" },
                            MILESTONES.map(m => e(MilestoneCard, { key: m.id, milestone: m, onClick: () => setSelected(m) }))
                        ),
                        e('div', { className: "mt-6 pt-4 border-t border-dashed border-gray-200" }, e(FacilitatorARCCard))
                    ),
                    e(SessionsStrip, { sessions: weekSessions, todayISO: week.todayISO, endThisISO: week.endThisISO })
                ),
                selected ? e(MilestoneModal, { milestone: selected, milestoneCourseSessions, onClose: () => setSelected(null) }) : null
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(e(PathwayPage));
    </script>
</body>

</html>
