<body class="bg-gray-50 text-wcg-darkText font-sans">

    <div id="root"></div>

    <script>
        const { useState, useEffect } = React;
        const e = React.createElement;

        // ---------------------------------------------------------------
        // Supabase configuration
        // ---------------------------------------------------------------
        const SUPABASE_URL = 'https://cftpufjzwpmhgzdcgpjb.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_b1H_5DJYLQSrr83T_dvz6A_2UAqOVg4';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ---------------------------------------------------------------
        // Icons
        // ---------------------------------------------------------------
        const Icons = {
            Calendar: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "16", height: "16", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('rect', { width: "18", height: "18", x: "3", y: "4", rx: "2", ry: "2" }), e('line', { x1: "16", x2: "16", y1: "2", y2: "6" }), e('line', { x1: "8", x2: "8", y1: "2", y2: "6" }), e('line', { x1: "3", x2: "21", y1: "10", y2: "10" })),
            Clock: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "16", height: "16", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('circle', { cx: "12", cy: "12", r: "10" }), e('polyline', { points: "12 6 12 12 16 14" })),
            Mail: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "22", height: "22", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('rect', { width: "20", height: "16", x: "2", y: "4", rx: "2" }), e('path', { d: "m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" })),
            Loader: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "28", height: "28", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round", className: "spin" }, e('path', { d: "M21 12a9 9 0 1 1-6.219-8.56" })),
            AlertTriangle: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "24", height: "24", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('path', { d: "m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" }), e('line', { x1: "12", x2: "12", y1: "9", y2: "13" }), e('line', { x1: "12", x2: "12.01", y1: "17", y2: "17" })),
            CalendarX: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "28", height: "28", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('rect', { width: "18", height: "18", x: "3", y: "4", rx: "2", ry: "2" }), e('line', { x1: "16", x2: "16", y1: "2", y2: "6" }), e('line', { x1: "8", x2: "8", y1: "2", y2: "6" }), e('line', { x1: "3", x2: "21", y1: "10", y2: "10" }), e('path', { d: "m9.5 15.5 5-5" }), e('path', { d: "m14.5 15.5-5-5" })),
            Trash: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "16", height: "16", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('path', { d: "M3 6h18" }), e('path', { d: "M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" }), e('path', { d: "M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" }), e('line', { x1: "10", x2: "10", y1: "11", y2: "17" }), e('line', { x1: "14", x2: "14", y1: "11", y2: "17" })),
            CalendarPlus: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "14", height: "14", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('rect', { x: "3", y: "4", width: "18", height: "18", rx: "2", ry: "2" }), e('line', { x1: "16", y1: "2", x2: "16", y2: "6" }), e('line', { x1: "8", y1: "2", x2: "8", y2: "6" }), e('line', { x1: "3", y1: "10", x2: "21", y2: "10" }), e('line', { x1: "12", y1: "14", x2: "12", y2: "20" }), e('line', { x1: "9", y1: "17", x2: "15", y2: "17" })),
            CalendarCheck: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "14", height: "14", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" }, e('rect', { x: "3", y: "4", width: "18", height: "18", rx: "2", ry: "2" }), e('line', { x1: "16", y1: "2", x2: "16", y2: "6" }), e('line', { x1: "8", y1: "2", x2: "8", y2: "6" }), e('line', { x1: "3", y1: "10", x2: "21", y2: "10" }), e('polyline', { points: "9 16 11 18 15 14" })),
            Check: () => e('svg', { xmlns: "http://www.w3.org/2000/svg", width: "18", height: "18", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2.5", strokeLinecap: "round", strokeLinejoin: "round" }, e('path', { d: "M20 6 9 17l-5-5" }))
        };

        // ---------------------------------------------------------------
        // Date / time helpers (same logic used across the other pages)
        // ---------------------------------------------------------------
        const WEEKDAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const SAST_OFFSET_MS = 2 * 60 * 60 * 1000; // Africa/Johannesburg is a fixed UTC+2, no DST

        const pad2 = (n) => String(n).padStart(2, '0');

        const parseDate = (dateStr) => {
            if (!dateStr) return new Date(8640000000000000);
            const d = new Date(`${dateStr}T00:00:00`);
            return isNaN(d.getTime()) ? new Date(8640000000000000) : d;
        };

        const getJoburgParts = (timestampMs) => {
            const shifted = new Date(timestampMs + SAST_OFFSET_MS);
            return {
                year: shifted.getUTCFullYear(),
                month: shifted.getUTCMonth() + 1,
                day: shifted.getUTCDate(),
                hours: shifted.getUTCHours(),
                minutes: shifted.getUTCMinutes(),
                seconds: shifted.getUTCSeconds(),
                weekdayIdx: shifted.getUTCDay()
            };
        };

        const toEpoch = (dateStr, timeStr) => {
            if (!dateStr || !timeStr) return null;
            const ts = new Date(`${dateStr}T${timeStr}+02:00`).getTime();
            return isNaN(ts) ? null : ts;
        };

        const formatDateDisplay = (dateObj) => {
            if (!dateObj || isNaN(dateObj.getTime())) return 'Date TBC';
            return `${WEEKDAY_NAMES[dateObj.getDay()]}, ${dateObj.getDate()} ${MONTH_NAMES[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
        };

        // ---------------------------------------------------------------
        // Add-to-calendar link builders (same as sessions.html)
        // ---------------------------------------------------------------
        const buildGoogleCalendarLink = ({ startParts, endParts, name, description, joinLink }) => {
            const fmt = (p) => `${p.year}${pad2(p.month)}${pad2(p.day)}T${pad2(p.hours)}${pad2(p.minutes)}${pad2(p.seconds)}`;
            const text = `\u{1F4BB} eTPD Webinar: ${name}`;
            const details = `${description || ''}\n\n\u{1F517} Join Link: \n${joinLink || ''}\n\n\u2139\uFE0F For more info: https://bit.ly/m/wcedtpd`;
            return `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(text)}&dates=${fmt(startParts)}/${fmt(endParts)}&details=${encodeURIComponent(details)}&location=Virtual%20Session`;
        };

        const buildOutlookLink = ({ startParts, endParts, name, joinLink }) => {
            const iso = (p) => `${p.year}-${pad2(p.month)}-${pad2(p.day)}T${pad2(p.hours)}:${pad2(p.minutes)}:${pad2(p.seconds)}`;
            const body = `Join Link: ${joinLink || ''}`;
            return `https://outlook.office.com/calendar/0/action/compose?allday=false&body=${encodeURIComponent(body)}&enddt=${encodeURIComponent(iso(endParts))}&location=Virtual%20Session&path=/calendar/action/compose&rru=addevent&startdt=${encodeURIComponent(iso(startParts))}&subject=${encodeURIComponent(name)}`;
        };

        // ---------------------------------------------------------------
        // "Today" / "this week" (Monday to Sunday) classification
        // ---------------------------------------------------------------
        function getDayStatus(dateISO) {
            const d = parseDate(dateISO);
            if (isNaN(d.getTime())) return 'later';
            d.setHours(0, 0, 0, 0);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            if (d.getTime() === today.getTime()) return 'today';
            const daysSinceMonday = (today.getDay() + 6) % 7;
            const weekEnd = new Date(today);
            weekEnd.setDate(today.getDate() - daysSinceMonday + 7); // next Monday 00:00
            return (d > today && d < weekEnd) ? 'week' : 'later';
        }

        const isValidEmail = (value) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((value || '').trim());

        // ---------------------------------------------------------------
        // On-device profile (read-only — same storage keys as Register /
        // preregister.js). Used only to pre-fill the email, never written to.
        // ---------------------------------------------------------------
        const DEVICE_PROFILES_KEY = 'iat_profiles';
        const DEVICE_ACTIVE_PROFILE_KEY = 'iat_active_profile_id';
        function readDeviceProfileEmail() {
            try {
                const raw = localStorage.getItem(DEVICE_PROFILES_KEY);
                const profiles = raw ? JSON.parse(raw) : [];
                if (!Array.isArray(profiles) || profiles.length === 0) return '';
                const activeId = localStorage.getItem(DEVICE_ACTIVE_PROFILE_KEY);
                const found = profiles.find(p => p.id === activeId) || profiles[0];
                return (found && found.email) ? found.email : '';
            } catch (err) {
                console.error('Could not read on-device profile', err);
                return '';
            }
        }

        // Lets other pages (e.g. the pre-registration banner and the direct-link
        // page) open this one already showing a specific person's list.
        function readEmailFromUrl() {
            try {
                const value = new URLSearchParams(window.location.search).get('email');
                return isValidEmail(value) ? value.trim() : '';
            } catch (err) {
                return '';
            }
        }

        const Badge = ({ children, type = 'default' }) => {
            let colorClass = 'bg-gray-100 text-gray-700 border-gray-200';
            const level = (children || '').toString().toLowerCase();
            if (type === 'level') {
                if (level.includes('foundation')) colorClass = 'bg-wcg-green text-white border-wcg-green';
                else if (level.includes('better')) colorClass = 'bg-wcg-red text-white border-wcg-red';
                else if (level.includes('i can')) colorClass = 'bg-wcg-yellow text-gray-900 border-wcg-yellow';
                else if (level.includes('summit')) colorClass = 'bg-wcg-blue text-white border-wcg-blue';
            }
            return e('span', { className: `px-2 py-0.5 rounded-md text-[11px] font-bold uppercase tracking-wide border ${colorClass} shadow-sm flex-shrink-0` }, children);
        };

        // ---------------------------------------------------------------
        // Fetches this person's upcoming pre-registered sessions.
        //
        // session_pre_registrations is no longer readable directly with the
        // publishable key (RLS blocks it) — this calls the my-registrations
        // Edge Function instead, which uses the service_role key server-side
        // and only ever returns rows matching the email it's given.
        // sessions/courses aren't personal data, so those are still queried
        // directly as before.
        // ---------------------------------------------------------------
        async function fetchMyRegistrations(email) {
            const trimmed = (email || '').trim();
            if (!trimmed) return [];

            const { data: preregRows, error: preregErr } = await supabaseClient.functions.invoke('my-registrations', { body: { email: trimmed } });
            if (preregErr) throw preregErr;

            const emailByIdKey = new Map();
            (preregRows || []).forEach(r => { if (r.id_key != null) emailByIdKey.set(String(r.id_key), r.email); });
            const idKeys = Array.from(emailByIdKey.keys());
            if (idKeys.length === 0) return [];

            const [sessionsRes, coursesRes] = await Promise.all([
                supabaseClient.from('sessions').select('id_key, session_title, session_date, session_start_time, session_link').in('id_key', idKeys),
                supabaseClient.from('courses').select('course_name, developmental_level, programme_duration, session_desciption')
            ]);
            if (sessionsRes.error) throw sessionsRes.error;
            if (coursesRes.error) throw coursesRes.error;

            const coursesByName = new Map();
            (coursesRes.data || []).forEach(c => { if (c.course_name) coursesByName.set(c.course_name, c); });

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            return (sessionsRes.data || [])
                .map(s => {
                    const course = coursesByName.get(s.session_title) || {};
                    const durationMin = Number(course.programme_duration) || 0;
                    const startEpoch = toEpoch(s.session_date, s.session_start_time);
                    const endEpoch = startEpoch !== null ? startEpoch + durationMin * 60000 : null;
                    const startParts = startEpoch !== null ? getJoburgParts(startEpoch) : null;
                    const endParts = endEpoch !== null ? getJoburgParts(endEpoch) : null;
                    const timeDisplay = (startParts && endParts)
                        ? `${pad2(startParts.hours)}:${pad2(startParts.minutes)} - ${pad2(endParts.hours)}:${pad2(endParts.minutes)}`
                        : (startParts ? `${pad2(startParts.hours)}:${pad2(startParts.minutes)}` : '');
                    return {
                        idKey: s.id_key,
                        email: emailByIdKey.get(String(s.id_key)) || trimmed,
                        name: s.session_title || 'Untitled Session',
                        dateISO: s.session_date || '',
                        time: timeDisplay,
                        level: course.developmental_level || '',
                        startTimestamp: startEpoch,
                        endTimestamp: endEpoch,
                        googleCal: (startParts && endParts)
                            ? buildGoogleCalendarLink({ startParts, endParts, name: s.session_title, description: course.session_desciption, joinLink: s.session_link })
                            : null,
                        outlookCal: (startParts && endParts)
                            ? buildOutlookLink({ startParts, endParts, name: s.session_title, joinLink: s.session_link })
                            : null
                    };
                })
                .filter(r => r.name !== 'Untitled Session')
                .filter(r => parseDate(r.dateISO) >= today)
                .sort((a, b) => parseDate(a.dateISO) - parseDate(b.dateISO) || a.time.localeCompare(b.time));
        }

        // Deletes a single pre-registration row, scoped to the exact id_key +
        // email pair so it can never affect anyone else's registration.
        // Routed through the cancel-registration Edge Function since RLS
        // blocks direct deletes with the publishable key.
        async function deletePreRegistration(idKey, email) {
            const { error } = await supabaseClient.functions.invoke('cancel-registration', { body: { idKey, email } });
            if (error) throw error;
        }

        // ---------------------------------------------------------------
        // UI pieces
        // ---------------------------------------------------------------
        function RegistrationCard({ registration, onCancel }) {
            const now = Date.now();
            const { startTimestamp: start, endTimestamp: end } = registration;
            const concluded = end !== null && start !== null && end > start && now > end;

            let status = getDayStatus(registration.dateISO);
            if (status === 'today' && concluded) status = 'concluded';

            const styles = {
                today: { card: "border-wcg-red bg-red-50/60 ring-2 ring-wcg-red/25", badge: "bg-wcg-red text-white", label: "Today" },
                week: { card: "border-wcg-blue/40 bg-blue-50/50", badge: "bg-wcg-blue text-white", label: "This week" },
                concluded: { card: "border-gray-200 bg-white opacity-70", badge: "bg-gray-200 text-gray-600", label: "Concluded" },
                later: { card: "border-gray-200 bg-white", badge: "", label: "" }
            }[status];

            const showCalendar = !concluded && (registration.googleCal || registration.outlookCal);
            const calBtn = "inline-flex items-center gap-1.5 bg-white border border-gray-200 hover:border-wcg-blue hover:bg-blue-50 text-gray-700 font-bold py-1.5 px-3 rounded-lg transition-all text-xs";

            return e('div', { className: `fade-in rounded-xl border shadow-sm p-4 sm:p-5 ${styles.card}` },
                e('div', { className: "flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-4" },
                    e('div', { className: "flex-1 min-w-0" },
                        styles.label ? e('span', { className: `inline-block mb-1.5 px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider ${styles.badge}` }, styles.label) : null,
                        e('h3', { className: "font-bold text-gray-900 text-sm sm:text-base" }, registration.name),
                        e('div', { className: "mt-1.5 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-gray-500" },
                            e('span', { className: "inline-flex items-center gap-1.5" }, e(Icons.Calendar), formatDateDisplay(parseDate(registration.dateISO))),
                            registration.time ? e('span', { className: "inline-flex items-center gap-1.5" }, e(Icons.Clock), registration.time) : null
                        )
                    ),
                    e('div', { className: "flex items-center gap-3 flex-shrink-0" },
                        registration.level ? e(Badge, { type: "level" }, registration.level) : null,
                        e('button', {
                            type: "button",
                            onClick: () => onCancel(registration),
                            title: "Cancel this pre-registration",
                            className: "flex items-center justify-center h-8 w-8 rounded-lg text-gray-400 hover:text-wcg-red hover:bg-red-50 transition-colors"
                        }, e(Icons.Trash))
                    )
                ),
                showCalendar ? e('div', { className: "mt-3 pt-3 border-t border-gray-200/70 flex flex-wrap items-center gap-2" },
                    e('span', { className: "text-[11px] font-bold uppercase tracking-wide text-gray-400 mr-1" }, "Add to calendar"),
                    registration.googleCal ? e('a', { href: registration.googleCal, target: "_blank", rel: "noreferrer", className: calBtn },
                        e('span', { className: "text-wcg-blue" }, e(Icons.CalendarPlus)), "Google") : null,
                    registration.outlookCal ? e('a', { href: registration.outlookCal, target: "_blank", rel: "noreferrer", className: calBtn },
                        e('span', { className: "text-blue-400" }, e(Icons.CalendarCheck)), "Outlook") : null
                ) : null
            );
        }

        function CancelConfirmModal({ registration, cancelling, onConfirm, onDismiss }) {
            return e('div', {
                className: "fixed inset-0 bg-black/50 flex items-center justify-center px-4 z-[10000]",
                onClick: onDismiss
            },
                e('div', {
                    className: "bg-white rounded-2xl shadow-xl p-6 max-w-sm w-full",
                    onClick: (ev) => ev.stopPropagation()
                },
                    e('h3', { className: "text-lg font-bold text-gray-900 mb-1" }, "Cancel this pre-registration?"),
                    e('p', { className: "text-sm text-gray-600 mb-5" },
                        "You'll be removing your pre-registration for ", e('strong', null, registration.name), ". This can't be undone."
                    ),
                    e('div', { className: "flex gap-3" },
                        e('button', {
                            type: "button", onClick: onDismiss, disabled: cancelling,
                            className: "flex-1 px-3 py-2.5 rounded-lg font-semibold text-sm border-2 border-gray-300 text-gray-600 hover:border-gray-400 transition-colors disabled:opacity-50"
                        }, "Keep it"),
                        e('button', {
                            type: "button", onClick: onConfirm, disabled: cancelling,
                            className: "flex-1 px-3 py-2.5 rounded-lg font-bold text-sm text-white bg-wcg-red hover:brightness-95 transition-colors disabled:opacity-60"
                        }, cancelling ? "Removing…" : "Cancel Registration")
                    )
                )
            );
        }

        function Toast({ toast }) {
            if (!toast) return null;
            const isError = toast.kind === 'error';
            return e('div', {
                className: `fixed bottom-6 left-1/2 -translate-x-1/2 z-[10001] px-4 py-3 rounded-xl shadow-lg text-sm font-semibold flex items-center gap-2 max-w-[90vw] ${isError ? 'bg-wcg-red text-white' : 'bg-wcg-green text-white'}`
            },
                isError ? e(Icons.AlertTriangle) : e(Icons.Check),
                e('span', null, toast.text)
            );
        }

        function EmailForm({ onSubmit }) {
            const [value, setValue] = useState('');
            const [touched, setTouched] = useState(false);
            const hasError = touched && !isValidEmail(value);

            const handleSubmit = (ev) => {
                ev.preventDefault();
                setTouched(true);
                if (!isValidEmail(value)) return;
                onSubmit(value.trim());
            };

            return e('div', { className: "max-w-md mx-auto mt-10 bg-white rounded-2xl shadow-sm border border-gray-200 p-6 sm:p-8 text-center fade-in" },
                e('div', { className: "mx-auto mb-4 h-12 w-12 rounded-full bg-blue-50 text-wcg-blue flex items-center justify-center" }, e(Icons.Mail)),
                e('h2', { className: "text-lg font-bold text-gray-900 mb-1" }, "Find Your Pre-Registrations"),
                e('p', { className: "text-sm text-gray-500 mb-5" }, "Enter the email address you used to pre-register for a session."),
                e('form', { onSubmit: handleSubmit, className: "text-left" },
                    e('input', {
                        type: "email", value, placeholder: "name@example.com",
                        onChange: (ev) => setValue(ev.target.value),
                        className: `w-full px-3.5 py-2.5 rounded-lg border-2 focus:outline-none text-sm mb-1 transition-colors ${hasError ? 'border-wcg-red' : 'border-gray-200 focus:border-wcg-blue'}`
                    }),
                    hasError ? e('p', { className: "text-xs text-wcg-red font-medium mb-3" }, "Enter a valid email address") : e('div', { className: "mb-3" }),
                    e('button', {
                        type: "submit",
                        className: "w-full bg-wcg-blue hover:bg-blue-800 text-white font-bold py-2.5 px-4 rounded-lg transition-colors text-sm shadow-sm"
                    }, "Show My Pre-Registrations")
                )
            );
        }

        function App() {
            const [email, setEmail] = useState(() => readEmailFromUrl() || readDeviceProfileEmail());
            const [emailSource, setEmailSource] = useState(() => readEmailFromUrl() ? 'manual' : (readDeviceProfileEmail() ? 'device' : null));
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [registrations, setRegistrations] = useState([]);
            const [refreshKey, setRefreshKey] = useState(0);
            const [menuOpen, setMenuOpen] = useState(false);
            const [pendingCancel, setPendingCancel] = useState(null);
            const [cancelling, setCancelling] = useState(false);
            const [toast, setToast] = useState(null);

            const showToast = (kind, text) => {
                setToast({ kind, text });
                setTimeout(() => setToast(null), 3500);
            };

            useEffect(() => {
                if (!email) return;
                let cancelled = false;
                (async () => {
                    setLoading(true);
                    setError(null);
                    try {
                        const list = await fetchMyRegistrations(email);
                        if (!cancelled) setRegistrations(list);
                    } catch (err) {
                        console.error('Error fetching pre-registrations:', err);
                        if (!cancelled) {
                            setError('Something went wrong while looking up your pre-registrations.');
                            setRegistrations([]);
                        }
                    } finally {
                        if (!cancelled) setLoading(false);
                    }
                })();
                return () => { cancelled = true; };
            }, [email, refreshKey]);

            const handleManualSearch = (value) => {
                setEmailSource('manual');
                setEmail(value);
            };

            const handleSwitchEmail = () => {
                setEmail('');
                setEmailSource(null);
                setRegistrations([]);
                setError(null);
            };

            const handleConfirmCancel = async () => {
                if (!pendingCancel) return;
                setCancelling(true);
                try {
                    await deletePreRegistration(pendingCancel.idKey, pendingCancel.email);
                    setRegistrations(prev => prev.filter(r => r.idKey !== pendingCancel.idKey));
                    showToast('success', `Removed your pre-registration for ${pendingCancel.name}.`);
                } catch (err) {
                    console.error('Error cancelling pre-registration:', err);
                    showToast('error', 'Could not remove that pre-registration. Please try again.');
                } finally {
                    setCancelling(false);
                    setPendingCancel(null);
                }
            };

            return e('div', { className: "min-h-screen pb-12 font-sans bg-gray-50" },
                null,

                e('div', { className: "max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 pt-8" },
                    e('h1', { className: "text-xl sm:text-2xl font-bold font-accent text-gray-900" }, "My Pre-Registrations"),
                    e('p', { className: "text-sm text-gray-500 mt-1" }, "A quick look at the upcoming sessions you're signed up for.")
                ),

                !email
                    ? e(EmailForm, { onSubmit: handleManualSearch })
                    : e('div', { className: "max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 mt-6" },
                        e('div', { className: "flex items-center justify-between flex-wrap gap-2 mb-5" },
                            e('p', { className: "text-sm text-gray-600" },
                                "Showing pre-registrations for ", e('strong', { className: "text-gray-900" }, email)
                            ),
                            e('button', {
                                onClick: handleSwitchEmail,
                                className: "text-xs font-semibold text-wcg-blue underline underline-offset-2 hover:text-blue-800 transition-colors"
                            }, emailSource === 'device' ? "Not you? Search a different email" : "Search a different email")
                        ),

                        loading
                            ? e('div', { className: "flex flex-col items-center justify-center py-16 text-gray-400" }, e(Icons.Loader), e('p', { className: "mt-3 text-sm" }, "Loading your pre-registrations…"))
                            : error
                                ? e('div', { className: "text-center py-16 px-4" },
                                    e('div', { className: "mx-auto mb-4 h-12 w-12 rounded-full bg-red-50 text-wcg-red flex items-center justify-center" }, e(Icons.AlertTriangle)),
                                    e('h3', { className: "font-bold text-gray-800 mb-1" }, "Couldn't load your pre-registrations"),
                                    e('p', { className: "text-sm text-gray-500 mb-5" }, error),
                                    e('button', {
                                        onClick: () => setRefreshKey(k => k + 1),
                                        className: "inline-flex items-center gap-2 bg-wcg-blue text-white font-bold text-sm px-4 py-2.5 rounded-lg hover:bg-blue-800 transition-colors"
                                    }, "Try Again")
                                )
                                : registrations.length === 0
                                    ? e('div', { className: "text-center py-16 px-4" },
                                        e('div', { className: "mx-auto mb-4 h-12 w-12 rounded-full bg-gray-100 text-gray-400 flex items-center justify-center" }, e(Icons.CalendarX)),
                                        e('h3', { className: "font-bold text-gray-800 mb-1" }, "No upcoming pre-registrations"),
                                        e('p', { className: "text-sm text-gray-500 mb-5" }, "You don't have any upcoming sessions pre-registered under this email."),
                                        e('a', {
                                            href: "sessions.html",
                                            className: "inline-flex items-center gap-2 bg-wcg-blue text-white font-bold text-sm px-4 py-2.5 rounded-lg hover:bg-blue-800 transition-colors"
                                        }, "Browse Upcoming Sessions")
                                    )
                                    : e('div', { className: "space-y-3" },
                                        (() => {
                                            const todayCount = registrations.filter(r => getDayStatus(r.dateISO) === 'today' && !(r.endTimestamp > r.startTimestamp && Date.now() > r.endTimestamp)).length;
                                            const weekCount = registrations.filter(r => getDayStatus(r.dateISO) === 'week').length + todayCount;
                                            if (weekCount === 0) return null;
                                            return e('div', { className: "flex flex-wrap gap-2 mb-1" },
                                                todayCount > 0 ? e('span', { className: "px-3 py-1 rounded-full bg-wcg-red text-white text-xs font-bold" }, `${todayCount} session${todayCount === 1 ? '' : 's'} today`) : null,
                                                e('span', { className: "px-3 py-1 rounded-full bg-blue-50 text-wcg-blue border border-wcg-blue/30 text-xs font-bold" }, `${weekCount} session${weekCount === 1 ? '' : 's'} this week`)
                                            );
                                        })(),
                                        registrations.map(r => e(RegistrationCard, { key: r.idKey, registration: r, onCancel: setPendingCancel }))
                                    )
                    ),

                pendingCancel ? e(CancelConfirmModal, {
                    registration: pendingCancel,
                    cancelling,
                    onConfirm: handleConfirmCancel,
                    onDismiss: () => { if (!cancelling) setPendingCancel(null); }
                }) : null,

                e(Toast, { toast })
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    </script>
</body>

</html>
