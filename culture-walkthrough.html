<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Culture Walkthrough — WCED 4P Diagnostic</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/minimal.min.css" />
    <link rel="stylesheet" href="css/theme.css" />
  </head>
  <body class="min-h-screen">
    <header class="app-header-sticky bg-[#001489] text-white py-3 px-6 shadow-sm">
      <div class="max-w-5xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-4">
          <a href="4p.html" class="text-white/80 hover:text-white transition text-sm flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Dashboard</span>
          </a>
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-user-large text-lg"></i>
            <span id="user-name" class="font-medium"></span>
          </div>
        </div>
        <span id="user-district" class="font-medium text-sm"></span>
      </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-6 pb-24">
      <h1 class="text-[var(--fs-heading-lg)] font-bold text-slate-800 mb-1">Culture Walkthrough</h1>
      <p class="text-slate-500 mb-6 text-sm">
        School-wide culture assessment, plus at least one linked classroom observation.
        Both save and submit together.
      </p>

      <!-- School selection -->
      <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm mb-6">
        <label class="field-label block mb-2">Select School</label>
        <select id="school-select" class="form-field w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#001489] focus:outline-none bg-white text-slate-800">
          <option value="">-- Loading schools... --</option>
        </select>
        <p id="school-select-error" class="mt-2 text-xs text-red-600 hidden"></p>
      </div>

      <!-- Toggle between Macro-Level Walkthrough and Classroom Observations -->
      <div id="section-toggle" class="hidden mb-6">
        <div class="inline-flex rounded-lg border border-slate-200 bg-slate-100 p-1 gap-1">
          <button id="toggle-macro-btn" type="button" data-section="macro"
            class="section-toggle-btn font-bold text-xs px-4 py-2 rounded-md transition flex items-center gap-1.5 text-slate-500 hover:text-slate-700">
            <i class="fa-solid fa-building-columns"></i>
            <span>Macro-Level School Culture</span>
          </button>
          <button id="toggle-classrooms-btn" type="button" data-section="classrooms"
            class="section-toggle-btn font-bold text-xs px-4 py-2 rounded-md transition flex items-center gap-1.5 text-slate-500 hover:text-slate-700">
            <i class="fa-solid fa-chalkboard-user"></i>
            <span>Classroom Observations</span>
            <span id="classroom-count-badge" class="bg-slate-300 text-slate-700 text-[10px] font-extrabold rounded-full px-1.5 py-0.5 min-w-[1.1rem] text-center"></span>
          </button>
        </div>
      </div>

      <!-- Walkthrough form mounts here once a school is selected -->
      <div id="macro-section-wrapper" class="hidden">
        <div id="walkthrough-container"></div>
      </div>

      <!-- Classroom observations section -->
      <div id="classrooms-section" class="hidden">
        <div class="flex items-center justify-between mb-2 gap-3 flex-wrap">
          <!-- Classroom 1 / Classroom 2 / ... switcher, each with its own remove icon -->
          <div id="classroom-tabs-bar" class="flex items-center gap-1.5 flex-wrap"></div>
          <button id="add-classroom-btn" type="button" title="Maximum of 3 classrooms per walkthrough"
            class="bg-white border border-[#001489]/30 hover:bg-blue-50/50 text-[#001489] font-bold text-xs px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shrink-0 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-white">
            <i class="fa-solid fa-plus"></i>
            <span>Add Classroom</span>
          </button>
        </div>
        <p class="text-xs text-slate-400 font-medium mb-3">(at least 1 classroom observation required, up to 3)</p>
        <!-- Each classroom-report instance mounts into its own panel here; only the active one is shown -->
        <div id="classroom-panels-mount"></div>
      </div>

      <!-- Save / Submit actions -->
      <div id="walkthrough-actions" class="mt-6 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 hidden">
        <p id="save-status" class="text-xs text-slate-500"></p>
        <div class="flex gap-3">
          <button id="save-draft-btn" type="button"
            class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold text-xs px-4 py-2.5 rounded-lg transition flex items-center gap-1.5">
            <i class="fa-solid fa-floppy-disk"></i>
            <span>Save Draft</span>
          </button>
          <button id="submit-final-btn" type="button"
            class="btn-primary font-extrabold text-xs px-5 py-2.5 rounded-lg transition flex items-center gap-1.5 uppercase">
            <i class="fa-solid fa-circle-check"></i>
            <span>Submit Walkthrough &amp; Classrooms</span>
          </button>
        </div>
      </div>
    </main>

    <script type="module">
      import { requireSession } from './js/session.js';
      import { fetchSchoolsForAdvisor, isHeadOffice } from './js/schools.js';
      import { createCultureWalkthrough } from './js/culture-walkthrough.js';
      import { createClassroomReport } from './js/classroom-report.js';
      import { submitCultureWalkthrough, fetchCultureWalkthroughById, fetchClassroomObservationsForWalkthrough } from './js/culture-walkthroughs.js';

      // If opened as culture-walkthrough.html?id=<uuid> (from Past Reports),
      // we're resuming an existing draft rather than starting fresh.
      const resumeId = new URLSearchParams(window.location.search).get('id');

      const advisor = requireSession('4p.html');
      if (!advisor) {
        throw new Error('No advisor session — redirecting to login.');
      }

      document.getElementById('user-name').textContent = advisor.full_name;
      document.getElementById('user-district').textContent = advisor.district;

      const schoolSelect = document.getElementById('school-select');
      const schoolSelectError = document.getElementById('school-select-error');
      const sectionToggle = document.getElementById('section-toggle');
      const toggleMacroBtn = document.getElementById('toggle-macro-btn');
      const toggleClassroomsBtn = document.getElementById('toggle-classrooms-btn');
      const classroomCountBadge = document.getElementById('classroom-count-badge');
      const macroSectionWrapper = document.getElementById('macro-section-wrapper');
      const walkthroughContainer = document.getElementById('walkthrough-container');
      const classroomsSection = document.getElementById('classrooms-section');
      const classroomTabsBar = document.getElementById('classroom-tabs-bar');
      const classroomPanelsMount = document.getElementById('classroom-panels-mount');
      const addClassroomBtn = document.getElementById('add-classroom-btn');
      const walkthroughActions = document.getElementById('walkthrough-actions');
      const saveDraftBtn = document.getElementById('save-draft-btn');
      const submitFinalBtn = document.getElementById('submit-final-btn');
      const saveStatus = document.getElementById('save-status');

      let currentWalkthrough = null; // createCultureWalkthrough() instance
      let currentSchoolCemis = null;
      const MAX_CLASSROOMS = 3;
      let classroomOrder = []; // ordered list of active classroom tab ids
      let activeClassroomId = null;
      let classroomTabCounter = 0; // ever-increasing, for unique tab ids (not reused after removal)
      const classroomReports = {}; // tabId -> createClassroomReport() instance
      const classroomPanelEls = {}; // tabId -> its mounted panel element
      let walkthroughLocked = false; // true once submitted — blocks removal
      let activeSection = 'macro'; // 'macro' | 'classrooms' — which section the toggle is showing

      // Shows exactly one of the two sections (Macro-Level Walkthrough vs
      // Classroom Observations) and styles the toggle buttons to match.
      function setActiveSection(section) {
        activeSection = section;

        macroSectionWrapper.classList.toggle('hidden', section !== 'macro');
        classroomsSection.classList.toggle('hidden', section !== 'classrooms');

        [
          [toggleMacroBtn, 'macro'],
          [toggleClassroomsBtn, 'classrooms'],
        ].forEach(([btn, key]) => {
          const isActive = key === section;
          btn.classList.toggle('bg-white', isActive);
          btn.classList.toggle('shadow-sm', isActive);
          btn.classList.toggle('text-[#001489]', isActive);
          btn.classList.toggle('text-slate-500', !isActive);
        });
      }

      toggleMacroBtn.addEventListener('click', () => setActiveSection('macro'));
      toggleClassroomsBtn.addEventListener('click', () => setActiveSection('classrooms'));

      function updateClassroomCountBadge() {
        classroomCountBadge.textContent = String(classroomOrder.length);
      }

      function showSchoolError(message) {
        if (!message) {
          schoolSelectError.classList.add('hidden');
          schoolSelectError.textContent = '';
          return;
        }
        schoolSelectError.classList.remove('hidden');
        schoolSelectError.textContent = message;
      }

      async function loadSchools() {
        const { data, error } = await fetchSchoolsForAdvisor(advisor);
        const scopeLabel = isHeadOffice(advisor) ? 'across all districts' : 'for your district';

        if (error) {
          schoolSelect.innerHTML = '<option value="">-- Unable to load schools --</option>';
          showSchoolError(
            `Could not load schools ${scopeLabel}. This is usually an RLS policy on the schools table blocking anonymous reads.`
          );
          return;
        }

        if (!data || data.length === 0) {
          schoolSelect.innerHTML = '<option value="">-- No schools found --</option>';
          showSchoolError(`No schools are loaded ${scopeLabel} yet.`);
          return;
        }

        if (isHeadOffice(advisor)) {
          const byDistrict = {};
          data.forEach((s) => {
            if (!byDistrict[s.district]) byDistrict[s.district] = [];
            byDistrict[s.district].push(s);
          });
          schoolSelect.innerHTML =
            '<option value="">-- Select a school --</option>' +
            Object.keys(byDistrict)
              .sort()
              .map(
                (district) =>
                  `<optgroup label="${district}">` +
                  byDistrict[district].map((s) => `<option value="${s.cemis_number}">${s.school_name}</option>`).join('') +
                  '</optgroup>'
              )
              .join('');
        } else {
          schoolSelect.innerHTML =
            '<option value="">-- Select a school --</option>' +
            data.map((s) => `<option value="${s.cemis_number}">${s.school_name}</option>`).join('');
        }
      }

      // Rebuilds the Classroom 1 / Classroom 2 / ... switcher row —
      // each pill is a label button plus its own small remove icon,
      // relabeled in order every time (so numbering never has gaps
      // after a removal). Also enforces the 1-required / 3-max caps.
      function renderClassroomTabsBar() {
        classroomTabsBar.innerHTML = classroomOrder
          .map((id, i) => {
            const isActive = id === activeClassroomId;
            const canRemove = classroomOrder.length > 1 && !walkthroughLocked;
            return `
              <div class="inline-flex items-center rounded-lg border overflow-hidden ${isActive ? 'border-[#001489]/40 bg-white shadow-sm' : 'border-slate-200 bg-slate-50'}">
                <button type="button" data-classroom-select="${id}"
                  class="px-3 py-1.5 text-xs font-bold transition ${isActive ? 'text-[#001489]' : 'text-slate-500 hover:text-slate-700'}">
                  Classroom ${i + 1}
                </button>
                <button type="button" data-classroom-remove="${id}" ${canRemove ? '' : 'disabled'}
                  title="${canRemove ? 'Remove this classroom' : 'At least one classroom observation is required'}"
                  class="px-2 py-1.5 border-l ${isActive ? 'border-[#001489]/20' : 'border-slate-200'} text-slate-300 hover:text-red-600 hover:bg-red-50 transition disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent disabled:hover:text-slate-300">
                  <i class="fa-solid fa-trash-can text-[11px]"></i>
                </button>
              </div>`;
          })
          .join('');

        addClassroomBtn.disabled = classroomOrder.length >= MAX_CLASSROOMS || walkthroughLocked;
        updateClassroomCountBadge();
      }

      // Delegated click handling — one listener covers every pill's
      // label button and remove icon, including ones added later.
      classroomTabsBar.addEventListener('click', (e) => {
        const selectBtn = e.target.closest('[data-classroom-select]');
        if (selectBtn) {
          setActiveClassroom(selectBtn.getAttribute('data-classroom-select'));
          return;
        }
        const removeBtn = e.target.closest('[data-classroom-remove]');
        if (removeBtn && !removeBtn.disabled) {
          removeClassroom(removeBtn.getAttribute('data-classroom-remove'));
        }
      });

      function setActiveClassroom(tabId) {
        if (!classroomPanelEls[tabId]) return;
        activeClassroomId = tabId;
        classroomOrder.forEach((id) => {
          classroomPanelEls[id].classList.toggle('hidden', id !== tabId);
        });
        renderClassroomTabsBar();
      }

      function addClassroomInstance(existingRow = null) {
        if (classroomOrder.length >= MAX_CLASSROOMS) return;

        classroomTabCounter += 1;
        const tabId = `classroom-${classroomTabCounter}`;

        const panelEl = document.createElement('div');
        panelEl.className = 'hidden';
        panelEl.setAttribute('data-classroom-panel', tabId);
        classroomPanelsMount.appendChild(panelEl);
        classroomPanelEls[tabId] = panelEl;

        const report = createClassroomReport(panelEl, {
          schoolCemis: currentSchoolCemis,
          advisorId: advisor.id,
          cultureWalkthroughId: currentWalkthrough ? currentWalkthrough.getData().id : null,
          stickyOffset: 56,
        });
        if (existingRow) report.loadData(existingRow);
        classroomReports[tabId] = report;

        classroomOrder.push(tabId);
        setActiveClassroom(tabId); // also re-renders the tab bar
      }

      function removeClassroom(tabId) {
        if (classroomOrder.length <= 1) return; // guard: at least 1 required
        const idx = classroomOrder.indexOf(tabId);
        if (idx === -1) return;

        classroomReports[tabId].destroy();
        delete classroomReports[tabId];
        classroomPanelEls[tabId].remove();
        delete classroomPanelEls[tabId];
        classroomOrder.splice(idx, 1);

        if (activeClassroomId === tabId) {
          const newIdx = Math.max(0, idx - 1);
          setActiveClassroom(classroomOrder[newIdx]);
        } else {
          renderClassroomTabsBar();
        }
      }

      function mountWalkthroughFor(schoolCemis) {
        if (currentWalkthrough) {
          currentWalkthrough.destroy();
          currentWalkthrough = null;
        }
        Object.values(classroomReports).forEach((report) => report.destroy());
        for (const key in classroomReports) delete classroomReports[key];
        for (const key in classroomPanelEls) delete classroomPanelEls[key];
        classroomPanelsMount.innerHTML = '';
        classroomTabsBar.innerHTML = '';
        classroomOrder = [];
        activeClassroomId = null;

        currentSchoolCemis = schoolCemis;
        updateClassroomCountBadge();

        if (!schoolCemis) {
          walkthroughContainer.innerHTML = '';
          sectionToggle.classList.add('hidden');
          walkthroughActions.classList.add('hidden');
          setActiveSection('macro');
          return;
        }

        currentWalkthrough = createCultureWalkthrough(walkthroughContainer, {
          schoolCemis,
          advisorId: advisor.id,
          stickyOffset: 56,
        });

        sectionToggle.classList.remove('hidden');
        walkthroughActions.classList.remove('hidden');
        saveStatus.textContent = '';
        // Always land on the Macro-Level Walkthrough first — that's step
        // one of the flow, with Classroom Observations a deliberate switch.
        setActiveSection('macro');
        // NOTE: does NOT auto-add a classroom instance anymore — the
        // caller (school-select handler for a fresh walkthrough, or
        // init() when resuming a draft) decides what to seed in.
      }

      schoolSelect.addEventListener('change', (e) => {
        showSchoolError(null);
        const cemis = e.target.value || null;
        mountWalkthroughFor(cemis);
        if (cemis) {
          // A fresh walkthrough always starts with one blank classroom.
          addClassroomInstance();
        }
      });

      addClassroomBtn.addEventListener('click', () => addClassroomInstance());

      function lockEverything() {
        saveDraftBtn.disabled = true;
        submitFinalBtn.disabled = true;
        schoolSelect.disabled = true;
        walkthroughLocked = true;
        renderClassroomTabsBar(); // re-render so Add + every remove icon disable too
      }

      async function handleSave({ submitted }) {
        if (!currentWalkthrough) return;

        const reportsInOrder = classroomOrder.map((id) => classroomReports[id]);

        if (submitted) {
          if (!currentWalkthrough.validate()) return;
          if (reportsInOrder.length === 0) {
            saveStatus.textContent = 'A Culture Walkthrough requires at least one classroom observation.';
            saveStatus.className = 'text-xs text-red-600 font-semibold';
            return;
          }
          const allClassroomsValid = reportsInOrder.every((report) => report.validate());
          if (!allClassroomsValid) {
            saveStatus.textContent = 'Please complete the required fields on every classroom observation.';
            saveStatus.className = 'text-xs text-red-600 font-semibold';
            return;
          }
        }

        const button = submitted ? submitFinalBtn : saveDraftBtn;
        const originalHtml = button.innerHTML;
        saveDraftBtn.disabled = true;
        submitFinalBtn.disabled = true;
        button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Saving...</span>';

        const submittedAt = submitted ? new Date().toISOString() : null;

        const walkthroughRow = currentWalkthrough.getData();
        walkthroughRow.submitted = submitted;
        walkthroughRow.submitted_at = submittedAt;

        const classroomRows = reportsInOrder.map((report) => {
          const row = report.getData();
          row.submitted = submitted;
          row.submitted_at = submittedAt;
          return row;
        });

        const { data, error } = await submitCultureWalkthrough(walkthroughRow, classroomRows);

        saveDraftBtn.disabled = false;
        submitFinalBtn.disabled = false;
        button.innerHTML = originalHtml;

        if (error) {
          saveStatus.textContent = `Error saving: ${error.message}`;
          saveStatus.className = 'text-xs text-red-600 font-semibold';
          return;
        }

        // Feed the returned ids back into each module so a second
        // save updates these same rows instead of inserting duplicates.
        currentWalkthrough.loadData({ ...walkthroughRow, id: data.id });
        reportsInOrder.forEach((report, i) => {
          const classroomId = data.classroom_ids[i];
          report.loadData({ ...classroomRows[i], id: classroomId });
        });

        if (submitted) {
          saveStatus.textContent = `Submitted at ${new Date(submittedAt).toLocaleString()}. This walkthrough is now locked for audit.`;
          saveStatus.className = 'text-xs text-emerald-700 font-semibold';
          lockEverything();
        } else {
          saveStatus.textContent = 'Draft saved.';
          saveStatus.className = 'text-xs text-slate-500';
        }
      }

      saveDraftBtn.addEventListener('click', () => handleSave({ submitted: false }));
      submitFinalBtn.addEventListener('click', () => handleSave({ submitted: true }));

      async function init() {
        await loadSchools();

        if (!resumeId) return;

        const { data: walkthroughRecord, error: walkthroughError } = await fetchCultureWalkthroughById(resumeId);
        if (walkthroughError || !walkthroughRecord) {
          showSchoolError('Could not load the requested walkthrough. It may have been deleted.');
          return;
        }

        const { data: classroomRows, error: classroomsError } = await fetchClassroomObservationsForWalkthrough(resumeId);
        if (classroomsError) {
          showSchoolError('Loaded the walkthrough, but could not load its classroom observations.');
        }

        schoolSelect.value = walkthroughRecord.school_cemis;
        mountWalkthroughFor(walkthroughRecord.school_cemis);
        currentWalkthrough.loadData(walkthroughRecord);

        if (classroomRows && classroomRows.length > 0) {
          classroomRows.forEach((row) => addClassroomInstance(row));
        } else {
          // Shouldn't normally happen (a walkthrough always has at
          // least one linked classroom observation), but fall back to
          // one blank instance rather than leaving the section empty.
          addClassroomInstance();
        }

        if (walkthroughRecord.submitted) {
          saveStatus.textContent = `Submitted at ${new Date(walkthroughRecord.submitted_at).toLocaleString()}. This walkthrough is locked for audit.`;
          saveStatus.className = 'text-xs text-emerald-700 font-semibold';
          lockEverything();
        } else {
          saveStatus.textContent = 'Resumed draft — continue editing below.';
          saveStatus.className = 'text-xs text-slate-500';
        }
      }

      init();
    </script>
  </body>
</html>
