<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classroom Observation — WCED 4P Diagnostic</title>
    <link rel="icon" type="image/png" href="imgs/4pfavicon.png" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/minimal.min.css" />
    <link rel="stylesheet" href="css/theme.css" />
  </head>
  <body class="min-h-screen">
    <div class="site-banner-wrap no-print">
      <img src="imgs/4P_header.png" alt="Western Cape Government eLearning 4P Affective Transformation Banner" class="site-banner" />
    </div>
    <div id="app-header"></div>

    <main class="max-w-5xl mx-auto p-4 md:p-6 pb-24">
      <h1 class="text-[var(--fs-heading-lg)] font-bold text-slate-800 mb-1">Classroom Observation</h1>
      <p class="text-slate-500 mb-6 text-sm">
        Standalone classroom observation — same diagnostic tool used inside a Culture Walkthrough.
      </p>

      <!-- School selection -->
      <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm mb-6">
        <label class="field-label block mb-2">Select School</label>
        <select id="school-select" class="w-full text-sm px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#001489] focus:outline-none bg-white text-slate-800">
          <option value="">-- Loading schools... --</option>
        </select>
        <p id="school-select-error" class="mt-2 text-xs text-red-600 hidden"></p>
      </div>

      <!-- Classroom report form mounts here once a school is selected -->
      <div id="report-container"></div>

      <!-- Save / Submit actions -->
      <div id="report-actions" class="mt-6 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 hidden">
        <p id="save-status" class="text-xs text-slate-500"></p>
        <div class="flex gap-3">
          <button id="view-report-btn" type="button"
            class="hidden btn-primary font-extrabold text-xs px-5 py-2.5 rounded-lg transition flex items-center gap-1.5 uppercase">
            <i class="fa-solid fa-arrow-right"></i>
            <span>View Classroom Report</span>
          </button>
          <button id="save-draft-btn" type="button"
            class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold text-xs px-4 py-2.5 rounded-lg transition flex items-center gap-1.5">
            <i class="fa-solid fa-floppy-disk"></i>
            <span>Save Draft</span>
          </button>
          <button id="submit-final-btn" type="button"
            class="btn-primary font-extrabold text-xs px-5 py-2.5 rounded-lg transition flex items-center gap-1.5 uppercase">
            <i class="fa-solid fa-circle-check"></i>
            <span>Submit Final</span>
          </button>
        </div>
      </div>
    </main>

    <footer class="site-footer no-print">
      <img src="imgs/wced-bug.jpg" alt="WCED Official Crest" class="site-footer-crest" />
      <span>Western Cape Education Department &mdash; eLearning 4P Affective Transformation</span>
    </footer>

    <script type="module">
      import { requireSession } from './js/session.js';
      import { fetchSchoolsForAdvisor, isHeadOffice } from './js/schools.js';
      import { createClassroomReport } from './js/classroom-report.js';
      import { saveClassroomObservation, fetchClassroomObservationById } from './js/classroom-observations.js';
      import { showReportReadyModal, reportHref } from './js/report-modal.js';
      import { mountAppHeader } from './js/app-header.js';

      // If opened as classroom-report.html?id=<uuid> (from Past Reports),
      // we're resuming an existing draft rather than starting fresh.
      const resumeId = new URLSearchParams(window.location.search).get('id');

      // Bounce to login if there's no session. requireSession() already
      // redirects; the null check just stops this script from doing any
      // more work while that redirect happens.
      const advisor = requireSession('4p.html');
      if (!advisor) {
        throw new Error('No advisor session — redirecting to login.');
      }


      const schoolSelect = document.getElementById('school-select');
      const schoolSelectError = document.getElementById('school-select-error');
      const reportContainer = document.getElementById('report-container');
      const reportActions = document.getElementById('report-actions');
      const saveDraftBtn = document.getElementById('save-draft-btn');
      const submitFinalBtn = document.getElementById('submit-final-btn');
      const viewReportBtn = document.getElementById('view-report-btn');
      const saveStatus = document.getElementById('save-status');

      let currentReport = null; // the createClassroomReport() instance, once a school is picked
      let reportLocked = false; // true once submitted — mirrors culture-walkthrough.html's walkthroughLocked

      // Shared nav bar. confirmLeave warns before navigating away via the
      // bar's own links while a report is in progress and not yet
      // submitted — it doesn't affect Save Draft/Submit, only the nav links.
      mountAppHeader(document.getElementById('app-header'), {
        active: 'classroom',
        advisor,
        maxWidth: 'max-w-5xl',
        confirmLeave: () => !!currentReport && !reportLocked,
      });

      function showSchoolError(message) {
        if (!message) {
          schoolSelectError.classList.add('hidden');
          schoolSelectError.textContent = '';
          return;
        }
        schoolSelectError.classList.remove('hidden');
        schoolSelectError.textContent = message;
      }

      async function loadSchools() {
        const { data, error } = await fetchSchoolsForAdvisor(advisor);
        const scopeLabel = isHeadOffice(advisor) ? 'across all districts' : 'for your district';

        if (error) {
          // Most likely cause: RLS blocking the anon role from reading
          // `schools` (see the note in schools.js) — surface that clearly
          // rather than leaving a silently-empty dropdown.
          schoolSelect.innerHTML = '<option value="">-- Unable to load schools --</option>';
          showSchoolError(
            `Could not load schools ${scopeLabel}. This is usually an RLS policy on the schools table blocking anonymous reads — see the comment at the top of js/schools.js.`
          );
          return;
        }

        if (!data || data.length === 0) {
          schoolSelect.innerHTML = '<option value="">-- No schools found --</option>';
          showSchoolError(`No schools are loaded ${scopeLabel} yet.`);
          return;
        }

        if (isHeadOffice(advisor)) {
          // Group by district so a HEAD OFFICE advisor isn't scrolling
          // an unstructured list of every school in the province.
          const byDistrict = {};
          data.forEach((s) => {
            if (!byDistrict[s.district]) byDistrict[s.district] = [];
            byDistrict[s.district].push(s);
          });
          schoolSelect.innerHTML =
            '<option value="">-- Select a school --</option>' +
            Object.keys(byDistrict)
              .sort()
              .map(
                (district) =>
                  `<optgroup label="${district}">` +
                  byDistrict[district].map((s) => `<option value="${s.cemis_number}">${s.school_name}</option>`).join('') +
                  '</optgroup>'
              )
              .join('');
        } else {
          schoolSelect.innerHTML =
            '<option value="">-- Select a school --</option>' +
            data.map((s) => `<option value="${s.cemis_number}">${s.school_name}</option>`).join('');
        }
      }

      function mountReportFor(schoolCemis) {
        if (currentReport) {
          currentReport.destroy();
          currentReport = null;
        }
        if (!schoolCemis) {
          reportContainer.innerHTML = '';
          reportActions.classList.add('hidden');
          return;
        }

        currentReport = createClassroomReport(reportContainer, {
          schoolCemis,
          advisorId: advisor.id,
          cultureWalkthroughId: null, // standalone report — not linked to a walkthrough
          stickyOffset: 56, // approx. header height — nudge if it visually overlaps
        });
        reportActions.classList.remove('hidden');
        saveStatus.textContent = '';
      }

      schoolSelect.addEventListener('change', (e) => {
        showSchoolError(null);
        mountReportFor(e.target.value || null);
      });

      // Once a report is submitted we know its id, so the advisor can jump
      // straight to the generated Classroom Observation report — either from
      // the pop-up (shown once, right after submit) or from this button.
      let submittedReportId = null;

      function openReportModal() {
        if (!submittedReportId) return;
        const href = reportHref('classroom', submittedReportId);
        showReportReadyModal({
          title: 'Classroom observation submitted',
          message: 'Your Classroom Observation report has been generated.',
          primary: { label: 'View Classroom Observation Report', href },
          dashboardHref: '4p.html',
        });
      }

      function enableViewReport(id) {
        submittedReportId = id;
        viewReportBtn.classList.remove('hidden');
      }

      viewReportBtn.addEventListener('click', () => {
        if (submittedReportId) window.location.href = reportHref('classroom', submittedReportId);
      });

      async function handleSave({ submitted }) {
        if (!currentReport) return;

        if (submitted && !currentReport.validate()) {
          return;
        }

        const button = submitted ? submitFinalBtn : saveDraftBtn;
        const originalHtml = button.innerHTML;
        button.disabled = true;
        button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Saving...</span>';

        const row = currentReport.getData();
        row.submitted = submitted;
        row.submitted_at = submitted ? new Date().toISOString() : null;

        const { data, error } = await saveClassroomObservation(row);

        button.disabled = false;
        button.innerHTML = originalHtml;

        if (error) {
          saveStatus.textContent = `Error saving: ${error.message}`;
          saveStatus.className = 'text-xs text-red-600 font-semibold';
          return;
        }

        // Keep the returned id so a second save updates this same row
        // instead of inserting a duplicate.
        currentReport.loadData(data);

        if (submitted) {
          saveStatus.textContent = `Submitted at ${new Date(data.submitted_at).toLocaleString()}. This report is now locked for audit.`;
          saveStatus.className = 'text-xs text-emerald-700 font-semibold';
          saveDraftBtn.disabled = true;
          submitFinalBtn.disabled = true;
          schoolSelect.disabled = true;
          reportLocked = true;
          enableViewReport(data.id);
          openReportModal();
        } else {
          saveStatus.textContent = 'Draft saved.';
          saveStatus.className = 'text-xs text-slate-500';
        }
      }

      saveDraftBtn.addEventListener('click', () => handleSave({ submitted: false }));
      submitFinalBtn.addEventListener('click', () => handleSave({ submitted: true }));

      async function init() {
        await loadSchools();

        if (!resumeId) return;

        const { data, error } = await fetchClassroomObservationById(resumeId);
        if (error || !data) {
          showSchoolError('Could not load the requested report. It may have been deleted.');
          return;
        }

        schoolSelect.value = data.school_cemis;
        mountReportFor(data.school_cemis);
        currentReport.loadData(data);

        if (data.submitted) {
          // Submitted reports are read-only per the lifecycle rules —
          // if someone lands here directly (e.g. a bookmarked link),
          // show it but don't allow further edits.
          saveStatus.textContent = `Submitted at ${new Date(data.submitted_at).toLocaleString()}. This report is locked for audit.`;
          saveStatus.className = 'text-xs text-emerald-700 font-semibold';
          saveDraftBtn.disabled = true;
          submitFinalBtn.disabled = true;
          schoolSelect.disabled = true;
          reportLocked = true;
          enableViewReport(data.id);
        } else {
          saveStatus.textContent = 'Resumed draft — continue editing below.';
          saveStatus.className = 'text-xs text-slate-500';
        }
      }

      init();
    </script>
  </body>
</html>
