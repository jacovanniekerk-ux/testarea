<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report — WCED 4P Diagnostic</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/minimal.min.css" />
    <link rel="stylesheet" href="css/theme.css" />
  </head>
  <body class="min-h-screen">
    <header class="app-header-sticky bg-[#001489] text-white py-3 px-6 shadow-sm no-print">
      <div class="max-w-4xl mx-auto flex items-center justify-between">
        <a href="past-reports.html" class="text-white/80 hover:text-white transition text-sm flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Past Reports</span>
        </a>
        <button id="print-btn" class="bg-[#001489] hover:bg-[#000e60] text-white font-black text-xs px-4 py-2 rounded-lg shadow-md transition flex items-center gap-1.5 uppercase tracking-wide border border-blue-900">
          <i class="fa-solid fa-print"></i>
          <span>Print / Save as PDF</span>
        </button>
      </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-6 pb-24">
      <div id="report-root">
        <p class="text-sm text-slate-400">Loading report...</p>
      </div>
    </main>

    <script type="module">
      import { requireSession } from './js/session.js';
      import { fetchReportData } from './js/report-data.js';
      import { calculateScores, getArchetypeInfo, getRadarGeometry, buildAffectiveContext } from './js/report-engine.js';

      const advisor = requireSession('4p.html');
      if (!advisor) {
        throw new Error('No advisor session — redirecting to login.');
      }

      const params = new URLSearchParams(window.location.search);
      const reportType = params.get('type'); // 'walkthrough' | 'classroom'
      const reportId = params.get('id');

      const rootEl = document.getElementById('report-root');
      document.getElementById('print-btn').addEventListener('click', () => window.print());

      function escapeHtml(str) {
        if (str === null || str === undefined || str === '') return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function nl2p(text) {
        return text
          .split('\n\n')
          .map((p) => `<p class="text-[11px] text-slate-700 font-medium leading-relaxed mb-2 last:mb-0">${escapeHtml(p)}</p>`)
          .join('');
      }

      function formatDateTime(value) {
        if (!value) return '—';
        return new Date(value).toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      }

      function formatDate(value) {
        if (!value) return '—';
        return new Date(value).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      }

      function renderError(message) {
        rootEl.innerHTML = `
          <div class="bg-white border border-red-200 rounded-xl p-6 shadow-sm">
            <p class="text-sm text-red-600 font-semibold">${escapeHtml(message)}</p>
          </div>`;
      }

      function renderNotSubmitted(resumeHref) {
        rootEl.innerHTML = `
          <div class="bg-amber-50 border border-amber-200 rounded-xl p-6 shadow-sm">
            <p class="text-sm text-amber-800 font-semibold mb-2">This report hasn't been submitted yet.</p>
            <p class="text-xs text-amber-700 mb-4">A report can only be generated once a walkthrough or classroom report has been finally submitted, since drafts are still subject to change.</p>
            <a href="${resumeHref}" class="inline-flex items-center gap-1.5 text-xs font-bold text-[#001489] hover:text-[#000e60]">
              <span>Go to draft</span>
              <i class="fa-solid fa-arrow-right"></i>
            </a>
          </div>`;
      }

      // ------------------------------------------------------------
      // Section header banner — the same colored-banner-with-icon-and-
      // pill-badge pattern used above all 5 sections in the original.
      // ------------------------------------------------------------
      function sectionBannerHtml(archetype, iconClass, title, badgeText) {
        return `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-3 sm:p-3.5 rounded-xl border shadow-sm"
               style="background-color:${archetype.color}14; border-color:${archetype.color}45; border-left-width:6px; border-left-color:${archetype.color};">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-lg flex items-center justify-center text-white shrink-0 shadow-sm" style="background-color:${archetype.color};">
                <i class="fa-solid ${iconClass}"></i>
              </div>
              <h3 class="text-xs sm:text-sm font-black uppercase tracking-wider text-[#001489]">${title}</h3>
            </div>
            <span class="text-[9px] sm:text-[10px] font-black uppercase px-2.5 py-1 rounded-md border"
                  style="background-color:${archetype.color}25; color:#001489; border-color:${archetype.color}50;">
              ${escapeHtml(badgeText)}
            </span>
          </div>`;
      }

      // ------------------------------------------------------------
      // Radar chart — exact geometry/styling from the original:
      // dashed concentric rings at r=18/36/54, solid ring at r=72,
      // axis lines, per-pillar colored labels with live scores,
      // filled polygon, colored dot markers per axis.
      // ------------------------------------------------------------
      const PILLAR_COLORS = { people: '#890C58', practices: '#D73828', pedagogy: '#00A1A3', platforms: '#C8126E' };

      function radarChartSvg(scores, archetype) {
        const { points, pointsPath } = getRadarGeometry(scores);
        const [peopleX, peopleY] = points.people.split(',');
        const [practicesX, practicesY] = points.practices.split(',');
        const [pedagogyX, pedagogyY] = points.pedagogy.split(',');
        const [platformsX, platformsY] = points.platforms.split(',');

        const labelsHtml = scores.isStandalone
          ? `
            <text x="100" y="192" font-size="8" font-weight="900" text-anchor="middle" fill="${PILLAR_COLORS.pedagogy}">PEDAGOGY (L${scores.pedagogyRating.toFixed(1)})</text>
            <text x="22" y="103" font-size="8" font-weight="900" text-anchor="end" fill="${PILLAR_COLORS.platforms}">PLATFORMS (L${scores.platformsRating.toFixed(1)})</text>`
          : `
            <text x="100" y="16" font-size="8" font-weight="900" text-anchor="middle" fill="${PILLAR_COLORS.people}">PEOPLE (L${scores.peopleRating.toFixed(1)})</text>
            <text x="178" y="103" font-size="8" font-weight="900" text-anchor="start" fill="${PILLAR_COLORS.practices}">PRACTICES (L${scores.practicesRating.toFixed(1)})</text>
            <text x="100" y="192" font-size="8" font-weight="900" text-anchor="middle" fill="${PILLAR_COLORS.pedagogy}">PEDAGOGY (L${scores.pedagogyRating.toFixed(1)})</text>
            <text x="22" y="103" font-size="8" font-weight="900" text-anchor="end" fill="${PILLAR_COLORS.platforms}">PLATFORMS (L${scores.platformsRating.toFixed(1)})</text>`;

        const dotsHtml = scores.isStandalone
          ? `
            <circle cx="${pedagogyX}" cy="${pedagogyY}" r="4" fill="${PILLAR_COLORS.pedagogy}" stroke="#fff" stroke-width="1" />
            <circle cx="${platformsX}" cy="${platformsY}" r="4" fill="${PILLAR_COLORS.platforms}" stroke="#fff" stroke-width="1" />`
          : `
            <circle cx="${peopleX}" cy="${peopleY}" r="4" fill="${PILLAR_COLORS.people}" stroke="#fff" stroke-width="1" />
            <circle cx="${practicesX}" cy="${practicesY}" r="4" fill="${PILLAR_COLORS.practices}" stroke="#fff" stroke-width="1" />
            <circle cx="${pedagogyX}" cy="${pedagogyY}" r="4" fill="${PILLAR_COLORS.pedagogy}" stroke="#fff" stroke-width="1" />
            <circle cx="${platformsX}" cy="${platformsY}" r="4" fill="${PILLAR_COLORS.platforms}" stroke="#fff" stroke-width="1" />`;

        return `
          <svg viewBox="-80 0 360 205" class="w-full max-w-[280px] h-auto">
            <circle cx="100" cy="100" r="18" fill="none" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2,2" />
            <circle cx="100" cy="100" r="36" fill="none" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2,2" />
            <circle cx="100" cy="100" r="54" fill="none" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2,2" />
            <circle cx="100" cy="100" r="72" fill="none" stroke="#94a3b8" stroke-width="0.75" />
            <line x1="100" y1="28" x2="100" y2="172" stroke="#94a3b8" stroke-width="0.5" />
            <line x1="28" y1="100" x2="172" y2="100" stroke="#94a3b8" stroke-width="0.5" />
            ${labelsHtml}
            <polygon points="${pointsPath}" fill="${archetype.color}25" stroke="${archetype.color}" stroke-width="2" />
            ${dotsHtml}
          </svg>`;
      }

      // ------------------------------------------------------------
      // Section 1: Institutional Diagnostic Level
      // ------------------------------------------------------------
      function pillarBadgeHtml(label, color, value, dimmed) {
        return `
          <div class="p-2 rounded-lg border text-center ${dimmed ? 'opacity-40' : ''}" style="background-color:${color}08; border-color:${color}25;">
            <span class="text-[8px] font-bold text-slate-500 block tracking-wider uppercase">${label}</span>
            <span class="text-sm font-black" style="color:${color};">${dimmed ? 'N/A' : `L${value.toFixed(1)}`}</span>
          </div>`;
      }

      function infrastructureBadgesHtml(school) {
        const items = [
          ['Computer Labs', school && school.computer_labs],
          ['Smart Classrooms', school && school.smart_classrooms],
          ['Learner Devices', school && school.learner_devices],
          ['Connectivity', school && school.connectivity],
        ];
        return items
          .map(([label, value]) => {
            const has = value && value.trim() !== '';
            return `<span class="text-[9.5px] font-semibold px-2 py-0.5 rounded border ${has ? 'bg-green-50 text-green-700 border-green-200' : 'bg-slate-50 text-slate-400 border-slate-200/50'}">
              ${label}: ${has ? escapeHtml(value) : 'Not on file'}
            </span>`;
          })
          .join('');
      }

      function section1Html({ scores, archetype, school, district, advisorName, dateValue }) {
        const metadataGrid = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs font-medium text-slate-700 bg-slate-50/60 p-3 rounded-lg border border-slate-200/80">
            <div class="flex items-center gap-2"><i class="fa-solid fa-building text-slate-400"></i><span><strong>School Name:</strong> ${escapeHtml(school ? school.school_name : 'N/A')}</span></div>
            <div class="flex items-center gap-2"><i class="fa-solid fa-layer-group text-slate-400"></i><span><strong>District Name:</strong> ${escapeHtml(district || 'N/A')}</span></div>
            <div class="flex items-center gap-2"><i class="fa-solid fa-calendar text-slate-400"></i><span><strong>Date of Visit:</strong> ${formatDate(dateValue)}</span></div>
            <div class="flex items-center gap-2"><i class="fa-solid fa-users text-slate-400"></i><span><strong>eLearning Advisor:</strong> ${escapeHtml(advisorName || 'N/A')}</span></div>
          </div>`;

        const pillarBadges = scores.isStandalone
          ? `${pillarBadgeHtml('PEOPLE', PILLAR_COLORS.people, 0, true)}${pillarBadgeHtml('PRACTICES', PILLAR_COLORS.practices, 0, true)}${pillarBadgeHtml('PEDAGOGY', PILLAR_COLORS.pedagogy, scores.pedagogyRating, false)}${pillarBadgeHtml('PLATFORMS', PILLAR_COLORS.platforms, scores.platformsRating, false)}`
          : `${pillarBadgeHtml('PEOPLE', PILLAR_COLORS.people, scores.peopleRating, false)}${pillarBadgeHtml('PRACTICES', PILLAR_COLORS.practices, scores.practicesRating, false)}${pillarBadgeHtml('PEDAGOGY', PILLAR_COLORS.pedagogy, scores.pedagogyRating, false)}${pillarBadgeHtml('PLATFORMS', PILLAR_COLORS.platforms, scores.platformsRating, false)}`;

        return `
          <div class="py-4 border-b border-slate-200 space-y-4">
            ${sectionBannerHtml(archetype, 'fa-award', '1. Institutional Diagnostic Level', `LEVEL ${archetype.levelNum}: ${archetype.name.toUpperCase()}`)}

            <div class="p-4 sm:p-5 rounded-2xl border shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4"
                 style="background-color:${archetype.color}12; border-color:${archetype.color}40; border-left-width:8px; border-left-color:${archetype.color};">
              <div class="space-y-1.5 max-w-2xl">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="text-[11px] font-black uppercase tracking-widest px-2.5 py-0.5 rounded-md text-white shadow-sm" style="background-color:${archetype.color};">LEVEL ${archetype.levelNum}</span>
                  <h2 class="text-xl sm:text-2xl font-black tracking-tight text-[#001489]">${archetype.name.toUpperCase()}</h2>
                </div>
                <p class="text-xs sm:text-sm font-semibold text-slate-700 leading-snug">${escapeHtml(archetype.tagline)}</p>
              </div>
              <div class="flex md:flex-col items-center md:items-end justify-between border-t md:border-t-0 md:border-l border-slate-200/80 pt-3 md:pt-0 md:pl-5 shrink-0">
                <span class="text-[9px] font-extrabold uppercase tracking-widest text-slate-500">Composite Score</span>
                <div class="flex items-baseline gap-1">
                  <span class="text-2xl sm:text-3xl font-black font-mono text-[#001489]">${scores.scoreAverage.toFixed(2)}</span>
                  <span class="text-xs font-bold text-slate-500 font-mono">/ 4.00</span>
                </div>
                <span class="text-[9px] font-black uppercase px-2 py-0.5 rounded mt-1" style="background-color:${archetype.color}25; color:#001489;">Level ${archetype.levelNum} of 4</span>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <div class="lg:col-span-8 space-y-3">
                ${metadataGrid}
                <div>
                  <h4 class="text-[9px] font-black tracking-wider text-slate-400 uppercase mb-1.5">Evaluated Infrastructure Details:</h4>
                  <div class="flex flex-wrap gap-1.5">${infrastructureBadgesHtml(school)}</div>
                </div>
                <div class="pt-1">
                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">${pillarBadges}</div>
                </div>
              </div>
              <div class="lg:col-span-4 flex flex-col items-center justify-center p-4 border border-slate-200 rounded-lg bg-slate-50/80 shadow-inner">
                <div class="flex items-center justify-between w-full mb-2">
                  <span class="text-[9px] font-extrabold uppercase text-slate-500 tracking-wider">4P Dimension Vector</span>
                  <span class="font-mono text-[9.5px] font-bold text-slate-700">Avg: <strong style="color:${archetype.color};">${scores.scoreAverage.toFixed(2)}</strong> / 4.00</span>
                </div>
                ${radarChartSvg(scores, archetype)}
              </div>
            </div>

            <div class="rounded-xl p-4 border shadow-sm" style="background-color:${archetype.color}0a; border-color:${archetype.color}35; border-left-width:4px; border-left-color:${archetype.color};">
              <div class="flex items-center gap-2 mb-2">
                <span class="w-2.5 h-2.5 rounded-full" style="background-color:${archetype.color};"></span>
                <h4 class="text-[11px] font-black uppercase tracking-wider text-[#001489]">Affective Diagnosis &amp; Context</h4>
              </div>
              ${nl2p(buildAffectiveContext(archetype, school, scores._classrooms))}
            </div>
          </div>`;
      }

      // ------------------------------------------------------------
      // Section 2: Operational to Affective Insight (Strategic Matrix)
      // ------------------------------------------------------------
      function section2Html(archetype) {
        const m = archetype.strategicMatrix;
        return `
          <div class="py-4 border-b border-slate-200 space-y-4">
            ${sectionBannerHtml(archetype, 'fa-compass', '2. Operational to Affective Insight', m.title)}
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div class="bg-white rounded-xl p-4 border shadow-sm flex flex-col justify-between" style="border-color:${archetype.color}35;">
                <div>
                  <div class="flex items-center gap-1.5 mb-2 pb-1.5 border-b border-slate-100">
                    <span class="text-[8.5px] font-black uppercase tracking-widest px-2 py-0.5 rounded" style="background-color:${archetype.color}15; color:#001489;">Operational Signals</span>
                  </div>
                  <p class="text-[11px] text-slate-700 font-medium leading-relaxed">${escapeHtml(m.operationalSignals)}</p>
                </div>
                <div class="mt-3 pt-2 border-t border-slate-100 text-[9px] text-slate-400 font-bold uppercase">What is monitored &amp; visible</div>
              </div>
              <div class="bg-white rounded-xl p-4 border shadow-sm flex flex-col justify-between" style="border-color:${archetype.color}35;">
                <div>
                  <div class="flex items-center gap-1.5 mb-2 pb-1.5 border-b border-slate-100">
                    <span class="text-[8.5px] font-black uppercase tracking-widest px-2 py-0.5 rounded" style="background-color:${archetype.color}20; color:#001489;">Affective &amp; Cultural Insight</span>
                  </div>
                  <p class="text-[11px] text-slate-700 font-medium leading-relaxed">${escapeHtml(m.affectiveInsight)}</p>
                </div>
                <div class="mt-3 pt-2 border-t border-slate-100 text-[9px] text-slate-400 font-bold uppercase">Human meaning behind the data</div>
              </div>
              <div class="rounded-xl p-4 border shadow-sm flex flex-col justify-between" style="background-color:${archetype.color}10; border-color:${archetype.color}45;">
                <div>
                  <div class="flex items-center gap-1.5 mb-2 pb-1.5 border-b" style="border-color:${archetype.color}25;">
                    <span class="text-[8.5px] font-black uppercase tracking-widest px-2 py-0.5 rounded text-white shadow-sm" style="background-color:${archetype.color};">Affective Reading</span>
                  </div>
                  <p class="text-[11px] font-black leading-relaxed text-[#001489]">${escapeHtml(m.affectiveReading)}</p>
                </div>
                <div class="mt-3 pt-2 border-t border-slate-200/50 text-[9px] font-black uppercase text-slate-500">Cultural mindset summary</div>
              </div>
            </div>
          </div>`;
      }

      // ------------------------------------------------------------
      // Section 3: Critical Advisory Lens
      // (single narrative card only — advisoryCheck/strategicActionRules
      // exist in the archetype data but are never actually rendered in
      // the original UI either, so they're correctly omitted here too.)
      // ------------------------------------------------------------
      function section3Html(archetype) {
        return `
          <div class="py-4 border-b border-slate-200 space-y-3">
            ${sectionBannerHtml(archetype, 'fa-wand-magic-sparkles', `3. Critical Advisory Lens for Affective Transformation - ${archetype.name}`, 'Cultural Lens')}
            <div class="rounded-xl p-4 border shadow-sm" style="background-color:${archetype.color}08; border-color:${archetype.color}35; border-left-width:4px; border-left-color:${archetype.color};">
              ${nl2p(archetype.criticalAdvisoryLens)}
            </div>
          </div>`;
      }

      // ------------------------------------------------------------
      // Section 4: Measures of Support
      // ------------------------------------------------------------
      function section4Html(archetype) {
        const cards = archetype.measuresOfSupport
          .map(
            (m) => `
            <div class="bg-white border rounded-xl p-3.5 shadow-sm flex flex-col justify-between" style="border-color:${archetype.color}35;">
              <div>
                <span class="inline-flex items-center justify-center text-[9.5px] font-black rounded px-2 py-1 mb-2.5 uppercase tracking-wide border w-full text-center"
                      style="background-color:${archetype.color}18; color:#001489; border-color:${archetype.color}45;">
                  ${escapeHtml(m.title)}
                </span>
                <p class="text-[10.5px] text-slate-700 leading-relaxed font-medium">${escapeHtml(m.text)}</p>
              </div>
            </div>`
          )
          .join('');

        return `
          <div class="py-4 border-b border-slate-200 space-y-3">
            ${sectionBannerHtml(archetype, 'fa-circle-check', '4. Measures of Support', '5 Key Pillars of Support')}
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-3.5">${cards}</div>
          </div>`;
      }

      // ------------------------------------------------------------
      // Section 5: Field Observation Findings & Evidence
      // ------------------------------------------------------------
      function evidenceFieldHtml(label, value, placeholder) {
        return `
          <div>
            <dt class="text-[8px] font-black uppercase text-slate-400 tracking-wider">${label}</dt>
            <dd class="text-slate-800 font-medium mt-0.5 bg-slate-50 border border-slate-150 rounded p-2 whitespace-pre-line min-h-[46px]">${escapeHtml(value) || placeholder}</dd>
          </div>`;
      }

      function classroomCardHtml(cls, idx, total) {
        const classLabel = total > 1 ? `Observed Classroom ${idx + 1}: ${cls.teacher_name || 'Unnamed'}` : 'Classroom Observation Context';

        const techFlags = [
          ['smartboard_observed', 'Smart Classroom Technology Use'],
          ['tablets_observed', 'Learner Tablets'],
          ['lab_observed', 'eLearning Lab Utilised'],
          ['internet_observed', 'Online Activities'],
          ['offline_observed', 'Offline Digital Resources/Tool'],
        ];
        const activeFlags = techFlags.filter(([field]) => cls[field]);
        const techHtml = activeFlags.length > 0
          ? `
            <div class="bg-white p-2.5 text-xs rounded border border-slate-200">
              <span class="text-[8px] font-black text-slate-400 block uppercase mb-1.5">Observed Live Technical Evidence:</span>
              <div class="flex flex-wrap gap-2 text-[9px] font-extrabold uppercase">
                ${activeFlags.map(([, label]) => `<span class="bg-green-50 text-green-700 border border-green-200 px-2 py-0.5 rounded">✓ ${label}</span>`).join('')}
              </div>
            </div>`
          : '';

        return `
          <div class="bg-slate-50/50 border border-slate-200/80 rounded-xl p-4 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-200 pb-2">
              <span class="text-[11px] font-black uppercase text-[#001489] tracking-wider">${escapeHtml(classLabel)}</span>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 text-xs bg-white p-3 rounded-lg border border-slate-200">
              <div><span class="text-[8px] font-black text-slate-400 block uppercase">TEACHER OBSERVED</span><span class="text-slate-800">${escapeHtml(cls.teacher_name) || 'N/A'}</span></div>
              <div><span class="text-[8px] font-black text-slate-400 block uppercase">SUBJECT</span><span class="text-slate-800">${escapeHtml(cls.subject_observed) || 'N/A'}</span></div>
              <div><span class="text-[8px] font-black text-slate-400 block uppercase">GRADE CLASS</span><span class="text-slate-800">${escapeHtml(cls.grade_observed) || 'N/A'}</span></div>
              <div><span class="text-[8px] font-black text-slate-400 block uppercase">LESSON FOCUS TOPIC</span><span class="text-slate-800">${escapeHtml(cls.lesson_topic) || 'N/A'}</span></div>
              <div><span class="text-[8px] font-black text-slate-400 block uppercase">LEARNERS IN CLASS</span><span class="text-slate-800">${escapeHtml(cls.learners_count) || 'N/A'}</span></div>
            </div>
            ${techHtml}
            <div class="bg-white border border-slate-200 rounded-xl p-4 space-y-3.5 shadow-sm">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                ${evidenceFieldHtml('Active Digital Tools &amp; Platforms Used in the Lesson', cls.tools_used, 'Not documented during classroom visit')}
                ${evidenceFieldHtml('Describe the learner activities in the lesson', cls.artifact_verified, 'Not documented')}
                ${evidenceFieldHtml('eAdvisor In-Classroom Suggestions &amp; Interventions', cls.advisor_support, 'No recommendations or interventions documented')}
                ${evidenceFieldHtml('eAdvisor General Classroom Comments', cls.general_comments, 'No general comments documented')}
              </div>
            </div>
          </div>`;
      }

      function section5Html(archetype, walkthrough, classrooms) {
        const walkthroughDetails = walkthrough && (walkthrough.primary_barrier || walkthrough.collaboration_channel)
          ? `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs mb-4">
              ${walkthrough.primary_barrier ? `
                <div class="bg-slate-50 p-2.5 text-[10.5px] rounded border border-slate-200">
                  <span class="text-[8px] font-black text-slate-400 block uppercase mb-0.5">Primary Identified Barrier</span>
                  <span class="text-slate-700 font-semibold">${escapeHtml(walkthrough.primary_barrier)}</span>
                </div>` : ''}
              ${walkthrough.collaboration_channel ? `
                <div class="bg-slate-50 p-2.5 text-[10.5px] rounded border border-slate-200">
                  <span class="text-[8px] font-black text-slate-400 block uppercase mb-0.5">Staff Peer-Sharing Mindset &amp; Trust</span>
                  <span class="text-slate-700 font-semibold">${escapeHtml(walkthrough.collaboration_channel)}</span>
                </div>` : ''}
            </div>`
          : '';

        const classroomCards = classrooms.map((cls, i) => classroomCardHtml(cls, i, classrooms.length)).join('<div class="h-6"></div>');

        return `
          <div class="py-4 border-b border-slate-200 space-y-4">
            ${sectionBannerHtml(archetype, 'fa-layer-group', '5. Field Observation Findings &amp; Evidence', 'Field Logs')}
            ${walkthroughDetails}
            <div class="space-y-6">${classroomCards}</div>
          </div>`;
      }

      function signatureBlockHtml(advisorName) {
        return `
          <div class="pt-8 grid grid-cols-2 gap-8">
            <div class="text-center space-y-8">
              <div class="h-px bg-slate-300 w-full"></div>
              <div class="text-[9px] text-slate-400 font-black uppercase tracking-widest leading-none">
                eLearning Advisor Signature
                <span class="block font-semibold lowercase text-slate-500 mt-1">${escapeHtml(advisorName) || 'Full name'}</span>
              </div>
            </div>
            <div class="text-center space-y-8">
              <div class="h-px bg-slate-300 w-full"></div>
              <div class="text-[9px] text-slate-400 font-black uppercase tracking-widest leading-none">
                School Principal Signature
                <span class="block font-semibold lowercase text-slate-500 mt-1">Authorized Seal &amp; Sign</span>
              </div>
            </div>
          </div>`;
      }

      function reportBrandingHeaderHtml(archetype, dateValue) {
        const refDate = dateValue ? String(dateValue).replace(/-/g, '').slice(0, 8) : '2026';
        return `
          <div class="no-print absolute top-0 left-0 right-0 h-1.5" style="background-color:${archetype.color};"></div>
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-slate-200">
            <div class="flex items-start gap-3">
              <div class="text-white font-extrabold text-lg w-10 h-10 rounded-md flex items-center justify-center shadow-sm shrink-0" style="background-color:${archetype.color};">4P</div>
              <div>
                <h2 class="text-base font-black text-[#001489] tracking-tight uppercase leading-none">Western Cape Education Department</h2>
                <p class="text-[9px] font-bold text-slate-500 tracking-wider mt-1 uppercase">ELEARNING DIRECTORATE — 4P AFFECTIVE TRANSFORMATION SUMMARY</p>
              </div>
            </div>
            <div class="text-right flex flex-col items-start md:items-end bg-slate-50 border border-slate-200 p-2 rounded-lg shrink-0">
              <span class="text-[8px] font-black tracking-wider text-slate-400 block uppercase">Report Ref Number:</span>
              <span class="font-mono text-[10px] font-bold text-slate-700">WCED-4P-${refDate}</span>
            </div>
          </div>`;
      }

      function renderReport({ walkthrough, classrooms, school, advisor: reportAdvisor }) {
        const scores = calculateScores(walkthrough, classrooms);
        scores._classrooms = classrooms; // carried through for buildAffectiveContext()
        const archetype = getArchetypeInfo(scores.scoreAverage);

        const district = school ? school.district : (reportAdvisor ? reportAdvisor.district : '—');
        const advisorName = reportAdvisor ? reportAdvisor.full_name : null;
        const dateValue = walkthrough ? walkthrough.visit_date : classrooms[0].created_at;

        rootEl.innerHTML = `
          <div id="printable-report" class="bg-white border border-slate-200 rounded-xl p-5 md:p-6 relative overflow-hidden shadow-sm">
            ${reportBrandingHeaderHtml(archetype, dateValue)}
            ${section1Html({ scores, archetype, school, district, advisorName, dateValue })}
            ${section2Html(archetype)}
            ${section3Html(archetype)}
            ${section4Html(archetype)}
            ${section5Html(archetype, walkthrough, classrooms)}
            ${signatureBlockHtml(advisorName)}
          </div>`;
      }

      async function init() {
        if (!reportType || !reportId) {
          renderError('This page needs a report type and id in the URL (e.g. report.html?type=walkthrough&id=...).');
          return;
        }

        const { walkthrough, classrooms, school, advisor: reportAdvisor, error } = await fetchReportData(reportType, reportId);

        if (error) {
          renderError(`Could not load this report: ${error.message}`);
          return;
        }

        if (classrooms.length === 0) {
          renderError('This report has no classroom observation data to display.');
          return;
        }

        const isSubmitted = reportType === 'walkthrough' ? walkthrough.submitted : classrooms[0].submitted;
        if (!isSubmitted) {
          const resumeHref = reportType === 'walkthrough' ? `culture-walkthrough.html?id=${reportId}` : `classroom-report.html?id=${reportId}`;
          renderNotSubmitted(resumeHref);
          return;
        }

        renderReport({ walkthrough, classrooms, school, advisor: reportAdvisor });
      }

      init();
    </script>
  </body>
</html>
