<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report — WCED 4P Diagnostic</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/minimal.min.css" />

    <style>
      * { box-sizing: border-box; }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #f8fafc;
        color: #1e293b;
        min-height: 100vh;
      }
      .btn-primary { background: #001489; color: white; }
      .btn-primary:hover { background: #000e60; }
      @media print {
        header, .no-print { display: none !important; }
        body { background: white; }
      }
    </style>
  </head>
  <body class="min-h-screen">
    <header class="bg-[#001489] text-white py-3 px-6 shadow-sm no-print">
      <div class="max-w-4xl mx-auto flex items-center justify-between">
        <a href="past-reports.html" class="text-white/80 hover:text-white transition text-sm flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Past Reports</span>
        </a>
        <button id="print-btn" class="text-white/80 hover:text-white transition text-sm flex items-center gap-1.5">
          <i class="fa-solid fa-print"></i>
          <span>Print</span>
        </button>
      </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-6 pb-24">
      <div id="report-root">
        <p class="text-sm text-slate-400">Loading report...</p>
      </div>
    </main>

    <script type="module">
      import { requireSession } from './js/session.js';
      import { fetchReportData } from './js/report-data.js';
      import { calculateScores, getArchetypeInfo, getRadarGeometry } from './js/report-engine.js';

      const advisor = requireSession('4p.html');
      if (!advisor) {
        throw new Error('No advisor session — redirecting to login.');
      }

      const params = new URLSearchParams(window.location.search);
      const reportType = params.get('type'); // 'walkthrough' | 'classroom'
      const reportId = params.get('id');

      const rootEl = document.getElementById('report-root');
      document.getElementById('print-btn').addEventListener('click', () => window.print());

      function escapeHtml(str) {
        if (str === null || str === undefined || str === '') return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function formatDateTime(value) {
        if (!value) return '—';
        return new Date(value).toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      }

      function formatDate(value) {
        if (!value) return '—';
        return new Date(value).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      }

      function renderError(message) {
        rootEl.innerHTML = `
          <div class="bg-white border border-red-200 rounded-xl p-6 shadow-sm">
            <p class="text-sm text-red-600 font-semibold">${escapeHtml(message)}</p>
          </div>`;
      }

      function renderNotSubmitted(resumeHref) {
        rootEl.innerHTML = `
          <div class="bg-amber-50 border border-amber-200 rounded-xl p-6 shadow-sm">
            <p class="text-sm text-amber-800 font-semibold mb-2">This report hasn't been submitted yet.</p>
            <p class="text-xs text-amber-700 mb-4">A report can only be generated once a walkthrough or classroom report has been finally submitted, since drafts are still subject to change.</p>
            <a href="${resumeHref}" class="inline-flex items-center gap-1.5 text-xs font-bold text-[#001489] hover:text-[#000e60]">
              <span>Go to draft</span>
              <i class="fa-solid fa-arrow-right"></i>
            </a>
          </div>`;
      }

      // ------------------------------------------------------------
      // Radar chart rendering — 4-axis diamond grid (or 2-axis for a
      // standalone classroom report), with the actual score polygon
      // plotted on top, matching the original app's geometry exactly.
      // ------------------------------------------------------------
      function radarChartSvg(scores, archetype) {
        const { center, radius, points, pointsPath } = getRadarGeometry(scores);

        const axisAngles = scores.isStandalone
          ? [{ label: 'Pedagogy', angle: 90 }, { label: 'Platforms', angle: 180 }]
          : [
              { label: 'People', angle: 270 },
              { label: 'Practices', angle: 0 },
              { label: 'Pedagogy', angle: 90 },
              { label: 'Platforms', angle: 180 },
            ];

        const fullPoint = (angle) => {
          const rad = (angle * Math.PI) / 180;
          return { x: center + radius * Math.cos(rad), y: center + radius * Math.sin(rad) };
        };

        const gridRingsHtml = [0.25, 0.5, 0.75, 1.0]
          .map((factor) => {
            const ringPoints = axisAngles
              .map(({ angle }) => {
                const rad = (angle * Math.PI) / 180;
                const x = center + radius * factor * Math.cos(rad);
                const y = center + radius * factor * Math.sin(rad);
                return `${x},${y}`;
              })
              .join(' ');
            return `<polygon points="${ringPoints}" fill="none" stroke="#e2e8f0" stroke-width="1" />`;
          })
          .join('');

        const axisLinesHtml = axisAngles
          .map(({ angle }) => {
            const p = fullPoint(angle);
            return `<line x1="${center}" y1="${center}" x2="${p.x}" y2="${p.y}" stroke="#e2e8f0" stroke-width="1" />`;
          })
          .join('');

        const axisLabelsHtml = axisAngles
          .map(({ label, angle }) => {
            const p = fullPoint(angle);
            // Push labels slightly further out than the axis line ends
            const labelX = center + (p.x - center) * 1.22;
            const labelY = center + (p.y - center) * 1.22;
            const scoreKey = label.toLowerCase() + 'Rating';
            const value = scores[scoreKey] !== undefined ? scores[scoreKey].toFixed(2) : '';
            return `
              <text x="${labelX}" y="${labelY}" text-anchor="middle" dominant-baseline="middle"
                    font-size="8" font-weight="800" fill="#475569" text-transform="uppercase">${label}</text>
              <text x="${labelX}" y="${labelY + 9}" text-anchor="middle" dominant-baseline="middle"
                    font-size="9" font-weight="900" fill="${archetype.color}">${value}</text>`;
          })
          .join('');

        return `
          <svg viewBox="0 0 200 200" class="w-full max-w-xs mx-auto">
            ${gridRingsHtml}
            ${axisLinesHtml}
            <polygon points="${pointsPath}" fill="${archetype.color}22" stroke="${archetype.color}" stroke-width="2" />
            ${axisLabelsHtml}
          </svg>`;
      }

      function strategicMatrixHtml(archetype) {
        const m = archetype.strategicMatrix;
        return `
          <div class="p-5 border-b border-slate-100">
            <h2 class="text-xs font-black uppercase tracking-wide mb-1" style="color:${archetype.color};">${escapeHtml(m.title)}</h2>
            <p class="text-[10px] text-slate-400 mb-3">Reading operational evidence through an affective and cultural lens</p>
            <div class="space-y-3">
              <div class="bg-slate-50 border border-slate-200 rounded-lg p-3">
                <span class="text-[9px] font-black uppercase text-slate-400 block mb-1">Operational Signals Observed</span>
                <p class="text-xs text-slate-700 leading-relaxed">${escapeHtml(m.operationalSignals)}</p>
              </div>
              <div class="bg-slate-50 border border-slate-200 rounded-lg p-3">
                <span class="text-[9px] font-black uppercase text-slate-400 block mb-1">Affective &amp; Cultural Insight</span>
                <p class="text-xs text-slate-700 leading-relaxed">${escapeHtml(m.affectiveInsight)}</p>
              </div>
              <div class="rounded-lg p-3 border" style="background:${archetype.color}0F; border-color:${archetype.color}33;">
                <span class="text-[9px] font-black uppercase block mb-1" style="color:${archetype.color};">Affective Reading</span>
                <p class="text-xs font-semibold" style="color:${archetype.color};">${escapeHtml(m.affectiveReading)}</p>
              </div>
            </div>
          </div>`;
      }

      function criticalAdvisoryLensHtml(archetype) {
        const paragraphsHtml = archetype.criticalAdvisoryLens
          .split('\n\n')
          .map((p) => `<p class="text-xs text-slate-700 leading-relaxed mb-3 last:mb-0">${escapeHtml(p)}</p>`)
          .join('');

        const rulesHtml = archetype.strategicActionRules
          .map(
            (r) => `
            <div class="flex gap-3 items-start bg-slate-50 border border-slate-200 rounded-lg p-3">
              <span class="shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-black text-white" style="background:${archetype.color};">${escapeHtml(r.num)}</span>
              <div>
                <p class="text-xs font-black text-slate-800">${escapeHtml(r.rule)}</p>
                <p class="text-[11px] text-slate-600 leading-relaxed mt-0.5">${escapeHtml(r.text)}</p>
              </div>
            </div>`
          )
          .join('');

        return `
          <div class="p-5 border-b border-slate-100">
            <h2 class="text-xs font-black uppercase text-slate-700 tracking-wide mb-3">Critical Advisory Lens</h2>
            ${paragraphsHtml}
            <div class="rounded-lg p-3 my-3 border-l-4" style="background:${archetype.color}0A; border-color:${archetype.color};">
              <p class="text-xs font-black" style="color:${archetype.color};">${escapeHtml(archetype.advisoryCheck.question)}</p>
              <p class="text-[11px] text-slate-600 mt-1 leading-relaxed">${escapeHtml(archetype.advisoryCheck.detail)}</p>
            </div>
            <h3 class="text-[10px] font-black uppercase text-slate-500 tracking-wide mt-4 mb-2">Strategic Action Rules for This Visit</h3>
            <div class="space-y-2">${rulesHtml}</div>
          </div>`;
      }

      function measuresOfSupportHtml(archetype) {
        const cardsHtml = archetype.measuresOfSupport
          .map(
            (m) => `
            <div class="bg-white border border-slate-200 rounded-lg p-3">
              <p class="text-[11px] font-black mb-1" style="color:${archetype.color};">${escapeHtml(m.title)}</p>
              <p class="text-[11px] text-slate-600 leading-relaxed">${escapeHtml(m.text)}</p>
            </div>`
          )
          .join('');

        return `
          <div class="p-5 border-b border-slate-100">
            <h2 class="text-xs font-black uppercase text-slate-700 tracking-wide mb-3">Measures of Support</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">${cardsHtml}</div>
          </div>`;
      }

      function pillarBreakdownHtml(scores, walkthrough, classrooms) {
        const rows = [];

        if (!scores.isStandalone) {
          rows.push({
            label: 'People',
            score: scores.peopleRating,
            detail: `Psychological Safety: ${walkthrough.people_safety} · Digital Confidence: ${walkthrough.people_confidence}`,
          });
          rows.push({
            label: 'Practices',
            score: scores.practicesRating,
            detail: `Collaboration: ${walkthrough.practices_collab} · PD: ${walkthrough.practices_pd} · Cyber Wellness: ${walkthrough.practices_cyber}`,
          });
        }

        const avgField = (field) => classrooms.reduce((sum, c) => sum + (Number(c[field]) || 1), 0) / classrooms.length;
        rows.push({
          label: 'Pedagogy',
          score: scores.pedagogyRating,
          detail: `Design: ${avgField('pedagogy_design').toFixed(2)} · Agency: ${avgField('pedagogy_agency').toFixed(2)} · Inclusivity: ${avgField('pedagogy_inclusivity').toFixed(2)}${classrooms.length > 1 ? ` (averaged across ${classrooms.length} classrooms)` : ''}`,
        });

        const platformsDetailParts = [];
        if (!scores.isStandalone) platformsDetailParts.push(`Scheduling: ${walkthrough.platforms_scheduling}`);
        platformsDetailParts.push(`Tool Access: ${avgField('platforms_integration').toFixed(2)}`);
        platformsDetailParts.push(`ePortal: ${avgField('platforms_eportal').toFixed(2)}`);
        rows.push({ label: 'Platforms', score: scores.platformsRating, detail: platformsDetailParts.join(' · ') });

        return rows
          .map(
            (r) => `
            <div class="bg-white border border-slate-200 rounded-lg p-3">
              <div class="flex items-center justify-between mb-1">
                <span class="text-xs font-black uppercase text-slate-700">${r.label}</span>
                <span class="text-sm font-black text-slate-900">${r.score.toFixed(2)} <span class="text-slate-400 text-xs font-medium">/ 4.00</span></span>
              </div>
              <p class="text-[10px] text-slate-500">${escapeHtml(r.detail)}</p>
            </div>`
          )
          .join('');
      }

      function evidenceLogHtml(walkthrough, classrooms) {
        const sections = [];

        if (walkthrough && (walkthrough.primary_barrier || walkthrough.collaboration_channel)) {
          sections.push(`
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
              ${walkthrough.primary_barrier ? `
                <div class="bg-slate-50 p-2.5 rounded border border-slate-200">
                  <span class="text-[8px] font-black text-slate-400 block uppercase mb-0.5">Primary Identified Barrier</span>
                  <span class="text-slate-700 text-[11px] font-semibold">${escapeHtml(walkthrough.primary_barrier)}</span>
                </div>` : ''}
              ${walkthrough.collaboration_channel ? `
                <div class="bg-slate-50 p-2.5 rounded border border-slate-200">
                  <span class="text-[8px] font-black text-slate-400 block uppercase mb-0.5">Staff Collaboration Mindset</span>
                  <span class="text-slate-700 text-[11px] font-semibold">${escapeHtml(walkthrough.collaboration_channel)}</span>
                </div>` : ''}
            </div>`);
        }

        classrooms.forEach((c, i) => {
          const fields = [
            ['Tools & Platforms Used', c.tools_used],
            ['Learner Activities Observed', c.artifact_verified],
            ['eAdvisor Suggestions', c.advisor_support],
            ['General Comments', c.general_comments],
            ['Teacher PD / eTPD Suggestions', c.teacher_upskilling],
          ].filter(([, v]) => v);

          sections.push(`
            <div class="border border-slate-200 rounded-lg p-3 mb-3">
              <p class="text-xs font-black text-slate-800 mb-2">
                ${classrooms.length > 1 ? `Classroom ${i + 1} — ` : ''}${escapeHtml(c.teacher_name || 'Unnamed Teacher')}
                ${c.subject_observed ? `· ${escapeHtml(c.subject_observed)}` : ''}
                ${c.grade_observed ? `· ${escapeHtml(c.grade_observed)}` : ''}
              </p>
              ${fields.length === 0 ? '<p class="text-[10px] text-slate-400">No evidence notes recorded.</p>' : fields.map(([label, value]) => `
                <div class="mb-2">
                  <span class="text-[8px] font-black text-slate-400 block uppercase mb-0.5">${label}</span>
                  <p class="text-[11px] text-slate-700 leading-relaxed">${escapeHtml(value)}</p>
                </div>`).join('')}
            </div>`);
        });

        return sections.join('') || '<p class="text-xs text-slate-400">No evidence recorded.</p>';
      }

      function renderReport({ walkthrough, classrooms, school, advisor: reportAdvisor }) {
        const scores = calculateScores(walkthrough, classrooms);
        const archetype = getArchetypeInfo(scores.scoreAverage);

        const schoolName = school ? school.school_name : (walkthrough ? walkthrough.school_cemis : classrooms[0].school_cemis);
        const district = school ? school.district : '—';
        const advisorName = reportAdvisor ? reportAdvisor.full_name : '—';
        const dateValue = walkthrough ? walkthrough.visit_date : classrooms[0].created_at;
        const dateLabelFmt = walkthrough ? formatDate(dateValue) : formatDate(dateValue);
        const submittedAt = walkthrough ? walkthrough.submitted_at : classrooms[0].submitted_at;

        rootEl.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
            <div class="p-5 border-b border-slate-100">
              <p class="text-[10px] font-black uppercase text-slate-400 tracking-wider mb-1">
                ${scores.isStandalone ? 'Classroom Report' : 'Culture Walkthrough Report'}
              </p>
              <h1 class="text-xl font-black text-slate-900 tracking-tight">${escapeHtml(schoolName)}</h1>
              <div class="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-xs text-slate-500">
                <span><i class="fa-solid fa-map-pin mr-1"></i>${escapeHtml(district)}</span>
                <span><i class="fa-solid fa-user mr-1"></i>${escapeHtml(advisorName)}</span>
                <span><i class="fa-solid fa-calendar mr-1"></i>${dateLabelFmt}</span>
                <span><i class="fa-solid fa-lock mr-1"></i>Submitted ${formatDateTime(submittedAt)}</span>
              </div>
            </div>

            <div class="p-5 flex flex-col md:flex-row gap-6 items-center border-b border-slate-100" style="background:${archetype.color}0A;">
              <div class="shrink-0">${radarChartSvg(scores, archetype)}</div>
              <div class="flex-1 text-center md:text-left">
                <p class="text-[10px] font-black uppercase text-slate-400 tracking-wider mb-1">Composite Profile Average</p>
                <p class="text-4xl font-black" style="color:${archetype.color};">${scores.scoreAverage.toFixed(2)}<span class="text-lg text-slate-400 font-bold"> / 4.00</span></p>
                <p class="text-sm font-black uppercase tracking-wide mt-2" style="color:${archetype.color};">Level ${archetype.levelNum}: ${archetype.name}</p>
                <p class="text-xs text-slate-600 mt-1 italic">${escapeHtml(archetype.tagline)}</p>
                <p class="text-xs text-slate-700 mt-3 leading-relaxed">${escapeHtml(archetype.description)}</p>
              </div>
            </div>

            <div class="p-5 border-b border-slate-100">
              <h2 class="text-xs font-black uppercase text-slate-700 tracking-wide mb-3">Pillar Breakdown</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${pillarBreakdownHtml(scores, walkthrough, classrooms)}
              </div>
            </div>

            ${strategicMatrixHtml(archetype)}
            ${criticalAdvisoryLensHtml(archetype)}
            ${measuresOfSupportHtml(archetype)}

            <div class="p-5">
              <h2 class="text-xs font-black uppercase text-slate-700 tracking-wide mb-3">Field Observation Evidence</h2>
              ${evidenceLogHtml(walkthrough, classrooms)}
            </div>
          </div>`;
      }

      async function init() {
        if (!reportType || !reportId) {
          renderError('This page needs a report type and id in the URL (e.g. report.html?type=walkthrough&id=...).');
          return;
        }

        const { walkthrough, classrooms, school, advisor: reportAdvisor, error } = await fetchReportData(reportType, reportId);

        if (error) {
          renderError(`Could not load this report: ${error.message}`);
          return;
        }

        if (classrooms.length === 0) {
          renderError('This report has no classroom observation data to display.');
          return;
        }

        const isSubmitted = reportType === 'walkthrough' ? walkthrough.submitted : classrooms[0].submitted;
        if (!isSubmitted) {
          const resumeHref = reportType === 'walkthrough' ? `culture-walkthrough.html?id=${reportId}` : `classroom-report.html?id=${reportId}`;
          renderNotSubmitted(resumeHref);
          return;
        }

        renderReport({ walkthrough, classrooms, school, advisor: reportAdvisor });
      }

      init();
    </script>
  </body>
</html>
